title: "第3週：動詞の時制と助動詞"
description: "ドイツ語の動詞の時制（過去形・完了形・未来形）と助動詞を学習します。また、分離動詞の使い方も身につけます。"
week_number: 3
daily_goals:
  - day: 15
    title: "過去形と完了形の概要"
    tasks:
      - name: "ドイツ語の過去表現の種類"
        description: "ドイツ語には過去を表す形式として「過去形（Präteritum）」と「現在完了形（Perfekt）」の2種類があることを学びます。"
      - name: "過去形と完了形の違いと使い分け"
        description: "過去形と完了形の基本的な違いと、どのような場面で使われるのかを学習します。"
    grammar:
      - title: "過去形（Präteritum）と完了形（Perfekt）の比較"
        explanation: "ドイツ語では、過去の出来事を表現するのに「過去形」と「完了形」の2つの形があります。話し言葉では主に完了形が使われ、書き言葉では過去形が多く使われます。特に「sein」と「haben」の過去形はよく使います。"
        table:
          - type: "過去形（Präteritum）"
            usage: "主に書き言葉で使われる。物語、報告書、新聞など。"
            structure: "主語 + 過去形の動詞"
            example: "Ich ging gestern ins Kino.（私は昨日映画館に行った。）"
          - type: "完了形（Perfekt）"
            usage: "主に話し言葉で使われる。日常会話など。"
            structure: "主語 + 助動詞（haben/sein） + 目的語など + 過去分詞"
            example: "Ich habe gestern einen Film gesehen.（私は昨日映画を見た。）"
    vocabulary:
      - word: "gestern"
        pronunciation: "ゲスターン"
        meaning: "昨日"
        audio_file: "gestern.mp3"
      - word: "letzte Woche"
        pronunciation: "レッツテ ヴォッヘ"
        meaning: "先週"
        audio_file: "letzte_woche.mp3"
      - word: "letztes Jahr"
        pronunciation: "レッツテス ヤール"
        meaning: "去年"
        audio_file: "letztes_jahr.mp3"
      - word: "früher"
        pronunciation: "フリューアー"
        meaning: "以前"
        audio_file: "frueher.mp3"
      - word: "damals"
        pronunciation: "ダマルス"
        meaning: "当時"
        audio_file: "damals.mp3"
    examples:
      - german: "Gestern ging ich ins Kino."
        japanese: "昨日私は映画館に行った。（過去形）"
        audio_file: "example_praeteritum_1.mp3"
      - german: "Gestern bin ich ins Kino gegangen."
        japanese: "昨日私は映画館に行った。（完了形）"
        audio_file: "example_perfekt_1.mp3"
      - german: "Er hatte keine Zeit."
        japanese: "彼は時間がなかった。（過去形）"
        audio_file: "example_praeteritum_2.mp3"
      - german: "Er hat keine Zeit gehabt."
        japanese: "彼は時間がなかった。（完了形）"
        audio_file: "example_perfekt_2.mp3"

  - day: 16
    title: "完了形の作り方"
    tasks:
      - name: "haben と sein の使い分け"
        description: "完了形を作るとき、どの動詞にどの助動詞（haben または sein）を使うのかを学習します。"
      - name: "過去分詞の作り方"
        description: "規則動詞と不規則動詞の過去分詞の作り方を学習します。"
    grammar:
      - title: "完了形の基本構造"
        explanation: "完了形は「助動詞(haben/sein) + 過去分詞」で作ります。助動詞は人称変化しますが、過去分詞は変化しません。"
      - title: "haben と sein の使い分け"
        explanation: "基本的に次のルールに従います："
        items:
          - "他動詞（目的語を取る動詞）：haben を使う"
          - "移動や状態変化を表す自動詞：sein を使う"
          - "その他の自動詞：haben を使う"
        examples:
          - "haben を使う例：sehen（見る）, kaufen（買う）, machen（する）, lesen（読む）"
          - "sein を使う例：gehen（行く）, kommen（来る）, fahren（乗り物で行く）, einschlafen（寝入る）"
      - title: "過去分詞の作り方"
        table:
          - type: "規則動詞"
            formation: "ge + 語幹 + t/et"
            examples: "machen → gemacht, arbeiten → gearbeitet"
          - type: "不規則動詞"
            formation: "ge + 変化した語幹 + en"
            examples: "sehen → gesehen, fahren → gefahren"
          - type: "不分離の接頭辞を持つ動詞"
            formation: "接頭辞 + 語幹 + t/en (geなし)"
            examples: "verstehen → verstanden, besuchen → besucht"
          - type: "-ieren で終わる動詞"
            formation: "語幹 + t (geなし)"
            examples: "studieren → studiert, telefonieren → telefoniert"
    vocabulary:
      - word: "machen"
        pronunciation: "マッヘン"
        meaning: "する"
        audio_file: "machen.mp3"
        past_participle: "gemacht"
      - word: "kommen"
        pronunciation: "コメン"
        meaning: "来る"
        audio_file: "kommen.mp3"
        past_participle: "gekommen"
      - word: "gehen"
        pronunciation: "ゲーエン"
        meaning: "行く"
        audio_file: "gehen.mp3"
        past_participle: "gegangen"
      - word: "fahren"
        pronunciation: "ファーレン"
        meaning: "行く（乗り物で）"
        audio_file: "fahren.mp3"
        past_participle: "gefahren"
      - word: "sehen"
        pronunciation: "ゼーエン"
        meaning: "見る"
        audio_file: "sehen.mp3"
        past_participle: "gesehen"
    examples:
      - german: "Ich habe einen Brief geschrieben."
        japanese: "私は手紙を書きました。"
        audio_file: "example_haben_1.mp3"
      - german: "Er hat das Buch gelesen."
        japanese: "彼はその本を読みました。"
        audio_file: "example_haben_2.mp3"
      - german: "Wir sind nach Berlin gefahren."
        japanese: "私たちはベルリンへ行きました。"
        audio_file: "example_sein_1.mp3"
      - german: "Sie ist früh eingeschlafen."
        japanese: "彼女は早く眠りにつきました。"
        audio_file: "example_sein_2.mp3"

  - day: 17
    title: "過去形の作り方"
    tasks:
      - name: "規則動詞の過去形"
        description: "規則動詞の過去形の作り方を学習します。"
      - name: "不規則動詞の過去形"
        description: "よく使われる不規則動詞の過去形を学習します。"
      - name: "過去形の特別な形"
        description: "sein, haben, werdenの過去形を学習します。"
    grammar:
      - title: "規則動詞の過去形"
        explanation: "規則動詞の過去形は、語幹に -te を付け、人称によって語尾を変化させます。"
        table:
          - person: "ich"
            ending: "-te"
            example: "machte（する）"
          - person: "du"
            ending: "-test"
            example: "machtest"
          - person: "er/sie/es"
            ending: "-te"
            example: "machte"
          - person: "wir"
            ending: "-ten"
            example: "machten"
          - person: "ihr"
            ending: "-tet"
            example: "machtet"
          - person: "sie/Sie"
            ending: "-ten"
            example: "machten"
      - title: "不規則動詞の過去形"
        explanation: "不規則動詞は、過去形で語幹の母音が変化します。"
        examples:
          - "sehen（見る）→ sah"
          - "kommen（来る）→ kam"
          - "gehen（行く）→ ging"
          - "fahren（乗り物で行く）→ fuhr"
          - "lesen（読む）→ las"
      - title: "特別な動詞の過去形"
        table:
          - verb: "sein（〜である）"
            conjugation: "ich war, du warst, er/sie/es war, wir waren, ihr wart, sie/Sie waren"
          - verb: "haben（持っている）"
            conjugation: "ich hatte, du hattest, er/sie/es hatte, wir hatten, ihr hattet, sie/Sie hatten"
          - verb: "werden（〜になる）"
            conjugation: "ich wurde, du wurdest, er/sie/es wurde, wir wurden, ihr wurdet, sie/Sie wurden"
    vocabulary:
      - word: "leben"
        pronunciation: "レーベン"
        meaning: "生きる、暮らす"
        audio_file: "leben.mp3"
        past_tense: "lebte"
      - word: "spielen"
        pronunciation: "シュピーレン"
        meaning: "遊ぶ、演奏する"
        audio_file: "spielen.mp3"
        past_tense: "spielte"
      - word: "finden"
        pronunciation: "フィンデン"
        meaning: "見つける"
        audio_file: "finden.mp3"
        past_tense: "fand"
      - word: "geben"
        pronunciation: "ゲーベン"
        meaning: "与える"
        audio_file: "geben.mp3"
        past_tense: "gab"
      - word: "nehmen"
        pronunciation: "ネーメン"
        meaning: "取る"
        audio_file: "nehmen.mp3"
        past_tense: "nahm"
    examples:
      - german: "Ich war letztes Jahr in Deutschland."
        japanese: "私は去年ドイツにいました。"
        audio_file: "example_war.mp3"
      - german: "Er spielte jeden Tag Fußball."
        japanese: "彼は毎日サッカーをしていました。"
        audio_file: "example_spielte.mp3"
      - german: "Sie fand die Schlüssel nicht."
        japanese: "彼女は鍵を見つけられませんでした。"
        audio_file: "example_fand.mp3"
      - german: "Die Kinder hatten viel Spaß."
        japanese: "子供たちはとても楽しかったです。"
        audio_file: "example_hatten.mp3"

  - day: 18
    title: "助動詞（können, müssen, dürfen, sollen, wollen, möchten）"
    tasks:
      - name: "助動詞の基本"
        description: "助動詞の意味と基本的な使い方を学習します。"
      - name: "助動詞を使った文の作り方"
        description: "助動詞と本動詞を組み合わせた文の構造を学習します。"
      - name: "助動詞の現在形変化"
        description: "各助動詞の人称変化を学習します。"
    grammar:
      - title: "助動詞の基本"
        explanation: "助動詞は、「〜できる」「〜しなければならない」といった能力や必要性、許可などを表現するために使います。文の中では、助動詞は人称変化して2番目の位置に置き、本動詞は不定形のまま文末に置きます。"
      - title: "助動詞の意味"
        table:
          - verb: "können"
            meaning: "〜できる、可能"
            example: "Ich kann Deutsch sprechen.（私はドイツ語を話すことができます。）"
          - verb: "müssen"
            meaning: "〜しなければならない、必要"
            example: "Du musst jetzt gehen.（あなたは今行かなければなりません。）"
          - verb: "dürfen"
            meaning: "〜してもよい、許可"
            example: "Er darf hier rauchen.（彼はここでタバコを吸ってもいいです。）"
          - verb: "sollen"
            meaning: "〜すべきである、義務・期待"
            example: "Wir sollen fleißig lernen.（私たちは熱心に勉強すべきです。）"
          - verb: "wollen"
            meaning: "〜したい、意志"
            example: "Ihr wollt nach Japan reisen.（あなたたちは日本へ旅行したいです。）"
          - verb: "möchten"
            meaning: "〜したい、丁寧な希望"
            example: "Sie möchten einen Kaffee trinken.（彼女はコーヒーを飲みたいです。）"
      - title: "助動詞の現在形変化"
        table:
          - verb: "können"
            conjugation: "ich kann, du kannst, er/sie/es kann, wir können, ihr könnt, sie/Sie können"
          - verb: "müssen"
            conjugation: "ich muss, du musst, er/sie/es muss, wir müssen, ihr müsst, sie/Sie müssen"
          - verb: "dürfen"
            conjugation: "ich darf, du darfst, er/sie/es darf, wir dürfen, ihr dürft, sie/Sie dürfen"
          - verb: "sollen"
            conjugation: "ich soll, du sollst, er/sie/es soll, wir sollen, ihr sollt, sie/Sie sollen"
          - verb: "wollen"
            conjugation: "ich will, du willst, er/sie/es will, wir wollen, ihr wollt, sie/Sie wollen"
          - verb: "möchten"
            conjugation: "ich möchte, du möchtest, er/sie/es möchte, wir möchten, ihr möchtet, sie/Sie möchten"
    vocabulary:
      - word: "können"
        pronunciation: "ケネン"
        meaning: "〜できる"
        audio_file: "koennen.mp3"
      - word: "müssen"
        pronunciation: "ミュッセン"
        meaning: "〜しなければならない"
        audio_file: "muessen.mp3"
      - word: "dürfen"
        pronunciation: "ドゥルフェン"
        meaning: "〜してもよい"
        audio_file: "duerfen.mp3"
      - word: "sollen"
        pronunciation: "ゾレン"
        meaning: "〜すべきである"
        audio_file: "sollen.mp3"
      - word: "wollen"
        pronunciation: "ヴォレン"
        meaning: "〜したい"
        audio_file: "wollen.mp3"
    examples:
      - german: "Ich kann gut schwimmen."
        japanese: "私は上手に泳げます。"
        audio_file: "example_kann.mp3"
      - german: "Du musst früh aufstehen."
        japanese: "あなたは早く起きなければなりません。"
        audio_file: "example_musst.mp3"
      - german: "Darf ich hier fotografieren?"
        japanese: "ここで写真を撮ってもいいですか？"
        audio_file: "example_darf.mp3"
      - german: "Wir sollen gesund essen."
        japanese: "私たちは健康的な食事をすべきです。"
        audio_file: "example_sollen.mp3"
      - german: "Ich möchte ein Glas Wasser, bitte."
        japanese: "グラス一杯の水をください。"
        audio_file: "example_moechte.mp3"

  - day: 19
    title: "分離動詞"
    tasks:
      - name: "分離動詞の基本"
        description: "分離動詞（分離前つづりを持つ動詞）の基本を学習します。"
      - name: "分離動詞の文中での位置"
        description: "分離動詞が文中でどのように分離されるかを学習します。"
      - name: "よく使われる分離動詞"
        description: "代表的な分離動詞とその意味を学習します。"
    grammar:
      - title: "分離動詞の基本"
        explanation: "分離動詞は、前つづり（接頭辞）と基本動詞からなる動詞です。文中では、前つづりが分離して文末に置かれます。"
      - title: "分離される前つづりの例"
        items:
          - "ab-（離れる）"
          - "an-（近づく、始める）"
          - "auf-（開く、上がる）"
          - "aus-（外へ、終わる）"
          - "ein-（中に）"
          - "mit-（一緒に）"
          - "vor-（前に）"
          - "zu-（閉じる、加わる）"
      - title: "分離動詞の文中での位置"
        explanation: "平叙文では前つづりは文末に置かれ、本動詞は人称変化して2番目の位置に来ます。"
        examples:
          - "ankommen（到着する）：Er kommt morgen an.（彼は明日到着します。）"
          - "aufstehen（起きる）：Ich stehe früh auf.（私は早く起きます。）"
          - "einkaufen（買い物する）：Wir kaufen im Supermarkt ein.（私たちはスーパーで買い物します。）"
      - title: "分離動詞の完了形"
        explanation: "完了形では過去分詞の「ge」が本動詞と前つづりの間に入ります。"
        examples:
          - "ankommen → angekommen（Er ist gestern angekommen.）"
          - "aufstehen → aufgestanden（Ich bin früh aufgestanden.）"
          - "einkaufen → eingekauft（Wir haben im Supermarkt eingekauft.）"
    vocabulary:
      - word: "ankommen"
        pronunciation: "アンコメン"
        meaning: "到着する"
        audio_file: "ankommen.mp3"
      - word: "aufstehen"
        pronunciation: "アウフシュテーエン"
        meaning: "起きる"
        audio_file: "aufstehen.mp3"
      - word: "einkaufen"
        pronunciation: "アインカウフェン"
        meaning: "買い物する"
        audio_file: "einkaufen.mp3"
      - word: "ausgehen"
        pronunciation: "アウスゲーエン"
        meaning: "外出する"
        audio_file: "ausgehen.mp3"
      - word: "mitbringen"
        pronunciation: "ミットブリンゲン"
        meaning: "持ってくる"
        audio_file: "mitbringen.mp3"
    examples:
      - german: "Ich stehe jeden Tag um 7 Uhr auf."
        japanese: "私は毎日7時に起きます。"
        audio_file: "example_aufstehen.mp3"
      - german: "Der Zug kommt um 10 Uhr an."
        japanese: "その電車は10時に到着します。"
        audio_file: "example_ankommen.mp3"
      - german: "Kaufst du im Supermarkt ein?"
        japanese: "あなたはスーパーで買い物しますか？"
        audio_file: "example_einkaufen.mp3"
      - german: "Wir gehen heute Abend aus."
        japanese: "私たちは今晩外出します。"
        audio_file: "example_ausgehen.mp3"
      - german: "Bringst du deine Freundin mit?"
        japanese: "あなたは彼女を連れてきますか？"
        audio_file: "example_mitbringen.mp3"

  - day: 20
    title: "未来形"
    tasks:
      - name: "未来形の作り方"
        description: "werden + 不定詞による未来形の作り方を学習します。"
      - name: "現在形で未来を表す表現"
        description: "ドイツ語では現在形で未来を表すことができることを学習します。"
      - name: "未来の予定や計画を表す表現"
        description: "予定や計画を表す言い回しを学習します。"
    grammar:
      - title: "未来形の基本"
        explanation: "ドイツ語の未来形は、助動詞 werden + 不定詞で表します。werden は人称変化し、不定詞は文末に置かれます。"
        table:
          - person: "ich"
            conjugation: "werde"
            example: "Ich werde nach Deutschland fahren.（私はドイツへ行くつもりです。）"
          - person: "du"
            conjugation: "wirst"
            example: "Du wirst es verstehen.（あなたはそれを理解するでしょう。）"
          - person: "er/sie/es"
            conjugation: "wird"
            example: "Er wird morgen kommen.（彼は明日来るでしょう。）"
          - person: "wir"
            conjugation: "werden"
            example: "Wir werden zusammen essen.（私たちは一緒に食事をするつもりです。）"
          - person: "ihr"
            conjugation: "werdet"
            example: "Ihr werdet viel lernen.（あなたたちはたくさん学ぶでしょう。）"
          - person: "sie/Sie"
            conjugation: "werden"
            example: "Sie werden zufrieden sein.（彼らは満足するでしょう。）"
      - title: "現在形で表す未来"
        explanation: "ドイツ語では、未来の時点を表す副詞（morgen, nächste Woche など）と共に現在形を使うことでも未来を表現できます。実際、日常会話では未来のことを話すときにもこの形式がよく使われます。"
        examples:
          - "Ich fahre morgen nach Berlin.（私は明日ベルリンへ行きます。）"
          - "Nächstes Jahr besuche ich Japan.（来年私は日本を訪れます。）"
      - title: "予定や計画を表す表現"
        items:
          - "vorhaben + zu不定詞（〜するつもりだ）：Ich habe vor, Deutsch zu lernen."
          - "planen + zu不定詞（〜する計画だ）：Wir planen, nächstes Jahr nach Deutschland zu reisen."
          - "beabsichtigen + zu不定詞（〜するつもりだ）：Er beabsichtigt, ein Buch zu schreiben."
    vocabulary:
      - word: "werden"
        pronunciation: "ヴェアデン"
        meaning: "〜になる"
        audio_file: "werden.mp3"
      - word: "morgen"
        pronunciation: "モルゲン"
        meaning: "明日"
        audio_file: "morgen.mp3"
      - word: "übermorgen"
        pronunciation: "ユーバーモルゲン"
        meaning: "明後日"
        audio_file: "uebermorgen.mp3"
      - word: "nächste Woche"
        pronunciation: "ネクステ ヴォッヘ"
        meaning: "来週"
        audio_file: "naechste_woche.mp3"
      - word: "in Zukunft"
        pronunciation: "イン ツークンフト"
        meaning: "将来"
        audio_file: "in_zukunft.mp3"
    examples:
      - german: "Ich werde nächstes Jahr Deutsch lernen."
        japanese: "私は来年ドイツ語を勉強するつもりです。"
        audio_file: "example_futur_1.mp3"
      - german: "Wir fahren morgen nach Hamburg."
        japanese: "私たちは明日ハンブルクへ行きます。"
        audio_file: "example_praesens_zukunft_1.mp3"
      - german: "Was wirst du in den Ferien machen?"
        japanese: "あなたは休暇に何をするつもりですか？"
        audio_file: "example_futur_2.mp3"
      - german: "Ich habe vor, meine Großeltern zu besuchen."
        japanese: "私は祖父母を訪ねるつもりです。"
        audio_file: "example_vorhaben.mp3"

  - day: 21
    title: "第3週の総復習"
    tasks:
      - name: "過去形と完了形の復習"
        description: "過去形と完了形の違いと使い方を復習します。"
      - name: "助動詞と分離動詞の復習"
        description: "助動詞と分離動詞の使い方を復習します。"
      - name: "未来形の復習"
        description: "未来形の作り方と使い方を復習します。"
    practice:
      - title: "時制の練習"
        exercises:
          - question: "Ich _____ gestern ins Kino _____. (gehen, 完了形)"
            answer: "bin ... gegangen"
          - question: "Er _____ vor zwei Jahren in Berlin. (leben, 過去形)"
            answer: "lebte"
          - question: "Wir _____ nächste Woche nach München _____. (fahren, 未来形)"
            answer: "werden ... fahren"
          - question: "Was _____ du gestern _____ ? (machen, 完了形)"
            answer: "hast ... gemacht"
      - title: "助動詞と分離動詞の練習"
        exercises:
          - question: "Ich _____ Deutsch lernen. (können)"
            answer: "kann"
          - question: "Er _____ jetzt nach Hause gehen. (müssen)"
            answer: "muss"
          - question: "Wir _____ morgen früh _____ . (aufstehen)"
            answer: "stehen ... auf"
          - question: "_____ du im Supermarkt _____? (einkaufen)"
            answer: "Kaufst ... ein"
    examples:
      - german: "Gestern habe ich einen Film gesehen. Der Film war sehr interessant. Ich konnte alles verstehen. Mein Freund kam auch mit. Nach dem Film sind wir in ein Restaurant gegangen. Morgen werde ich wieder ins Kino gehen. Ich stehe früh auf und kaufe vorher im Supermarkt ein."
        japanese: "昨日、私は映画を見ました。その映画はとても面白かったです。私はすべてを理解することができました。私の友達も一緒に来ました。映画の後、私たちはレストランに行きました。明日、私はまた映画館に行くつもりです。私は早く起きて、その前にスーパーで買い物をします。"
        audio_file: "example_week3_review.mp3"

weekly_review:
  summary: "今週は、ドイツ語の動詞の時制（過去形、完了形、未来形）、助動詞、分離動詞を学習しました。これらの文法要素を使うことで、過去の出来事や将来の予定、能力や義務などを表現できるようになりました。"
  key_points:
    - "過去形は主に書き言葉で使われ、完了形は話し言葉でよく使われます。"
    - "完了形は haben または sein + 過去分詞で作ります。移動や状態変化を表す自動詞は sein を使います。"
    - "助動詞（können, müssen, dürfen など）は能力や義務、許可などを表し、文末に本動詞の不定形を置きます。"
    - "分離動詞は、文中で前つづりが分離して文末に置かれます。"
    - "未来形は werden + 不定詞で表しますが、未来を表す副詞と共に現在形でも表現できます。"
  next_steps: "次週は、複文と代名詞について学びます。接続詞や副文の使い方、そして代名詞（人称代名詞、所有代名詞）と形容詞の格変化を学習します。" 