title: "第7週：総復習と試験対策"
description: "ドイツ語検定3級に向けた総復習と試験対策を行います。模擬試験演習、弱点分野の強化、リスニング強化、重要文法・語彙の総復習、試験の時間配分練習などを実施します。"
week_number: 7
daily_goals:
  - day: 43
    title: "文法の総復習（1）"
    tasks:
      - name: "動詞の時制の復習"
        description: "現在形、過去形、完了形、未来形の総復習を行います。"
      - name: "助動詞と分離動詞の復習"
        description: "助動詞の用法と分離動詞の使い方を復習します。"
      - name: "zu不定詞と命令形の復習"
        description: "zu不定詞構文と命令形の作り方と使い方を復習します。"
    practice:
      - title: "動詞の時制"
        exercises:
          - question: "Ich _____ jetzt Deutsch. (lernen - 現在形)"
            answer: "lerne"
          - question: "Gestern _____ ich ins Kino. (gehen - 過去形)"
            answer: "ging"
          - question: "Ich _____ das Buch schon _____. (lesen - 完了形)"
            answer: "habe ... gelesen"
          - question: "Morgen _____ wir nach Berlin _____. (fahren - 未来形)"
            answer: "werden ... fahren"
      - title: "助動詞と分離動詞"
        exercises:
          - question: "Ich _____ Deutsch sprechen. (können)"
            answer: "kann"
          - question: "Du _____ jetzt nach Hause gehen. (müssen)"
            answer: "musst"
          - question: "Wir _____ um 7 Uhr _____. (aufstehen)"
            answer: "stehen ... auf"
          - question: "_____ du im Supermarkt _____? (einkaufen)"
            answer: "Kaufst ... ein"
      - title: "zu不定詞と命令形"
        exercises:
          - question: "Er versucht, Deutsch _____ _____. (lernen)"
            answer: "zu lernen"
          - question: "Wir haben vor, nächstes Jahr nach Deutschland _____ _____. (reisen)"
            answer: "zu reisen"
          - question: "_____ mir! (helfen - du形)"
            answer: "Hilf"
          - question: "_____ Sie bitte langsamer! (sprechen - Sie形)"
            answer: "Sprechen"
    vocabulary_review:
      - category: "時間表現"
        words:
          - "heute（今日）"
          - "gestern（昨日）"
          - "morgen（明日）"
          - "jetzt（今）"
          - "später（後で）"
          - "früher（以前）"
      - category: "頻度の表現"
        words:
          - "immer（いつも）"
          - "oft（よく）"
          - "manchmal（時々）"
          - "selten（めったに〜ない）"
          - "nie（決して〜ない）"
    examples:
      - german: "Ich lerne seit zwei Jahren Deutsch. Gestern habe ich einen deutschen Film gesehen. Der Film war sehr interessant. Morgen werde ich ins deutsche Restaurant gehen. Ich kann schon ein bisschen Deutsch sprechen, aber ich muss noch viel lernen. Ich stehe jeden Tag früh auf und lerne Deutsch. Ich versuche, jeden Tag neue Wörter zu lernen."
        japanese: "私は2年前からドイツ語を学んでいます。昨日ドイツ映画を見ました。その映画はとても面白かったです。明日ドイツレストランに行くつもりです。私はすでに少しドイツ語を話すことができますが、まだたくさん学ばなければなりません。私は毎日早く起きてドイツ語を学んでいます。私は毎日新しい単語を学ぼうとしています。"
        audio_file: "example_grammar_review_1.mp3"

  - day: 44
    title: "文法の総復習（2）"
    tasks:
      - name: "名詞と冠詞の格変化の復習"
        description: "名詞と冠詞の格変化（1格、3格、4格）を復習します。"
      - name: "形容詞の格変化と比較変化の復習"
        description: "形容詞の格変化と比較級・最上級を復習します。"
      - name: "代名詞の復習"
        description: "人称代名詞、所有代名詞、関係代名詞などを復習します。"
    practice:
      - title: "名詞と冠詞の格変化"
        exercises:
          - question: "_____ Mann ist Lehrer. (der - 1格)"
            answer: "Der"
          - question: "Ich helfe _____ Frau. (die - 3格)"
            answer: "der"
          - question: "Ich sehe _____ Kind. (das - 4格)"
            answer: "das"
          - question: "Er gibt _____ Kindern Geschenke. (die - 3格 複数)"
            answer: "den"
      - title: "形容詞の格変化と比較変化"
        exercises:
          - question: "Ein _____ Mann steht dort. (alt - 1格)"
            answer: "alter"
          - question: "Ich kaufe eine _____ Tasche. (schön - 4格)"
            answer: "schöne"
          - question: "Tokio ist _____ als Kyoto. (groß - 比較級)"
            answer: "größer"
          - question: "Der Mount Fuji ist der _____ Berg in Japan. (hoch - 最上級)"
            answer: "höchste"
      - title: "代名詞"
        exercises:
          - question: "Ich sehe _____. (du - 4格)"
            answer: "dich"
          - question: "Er gibt _____ ein Buch. (ich - 3格)"
            answer: "mir"
          - question: "Das ist _____ Buch. (ich - 所有代名詞)"
            answer: "mein"
          - question: "Der Mann, _____ dort steht, ist mein Vater. (関係代名詞 - 1格)"
            answer: "der"
    vocabulary_review:
      - category: "場所の表現"
        words:
          - "hier（ここで）"
          - "dort（そこで）"
          - "links（左に）"
          - "rechts（右に）"
          - "oben（上で）"
          - "unten（下で）"
      - category: "方向の表現"
        words:
          - "nach（〜へ）"
          - "zu（〜へ）"
          - "aus（〜から）"
          - "von（〜から）"
          - "durch（〜を通って）"
    examples:
      - german: "Der alte Mann gibt dem kleinen Kind ein interessantes Buch. Das Kind ist jünger als ich, aber es ist klüger. Das ist sein Buch. Ich habe mein Buch zu Hause vergessen. Der Mann, der dort wohnt, ist älter als mein Vater. Ich sehe ihn oft im Park. Er gibt mir manchmal Süßigkeiten."
        japanese: "その年配の男性はその小さな子供に面白い本をあげます。その子供は私より若いですが、より賢いです。それは彼の本です。私は自分の本を家に忘れました。そこに住んでいる男性は私の父より年上です。私は彼をよく公園で見かけます。彼は時々私にお菓子をくれます。"
        audio_file: "example_grammar_review_2.mp3"

  - day: 45
    title: "文法の総復習（3）と語彙強化（2）"
    tasks:
      - name: "文の構造の復習"
        description: "単文と複文の構造、語順などを復習します。"
      - name: "接続法と受動態の復習"
        description: "接続法II式の基本と受動態の作り方を復習します。"
      - name: "場面別語彙の強化"
        description: "様々な場面で使える語彙を強化します。"
    practice:
      - title: "文の構造"
        exercises:
          - question: "私は昨日映画を見ました。(German word order)"
            answer: "Ich habe gestern einen Film gesehen."
          - question: "Ich weiß, _____ er morgen kommt. (dass)"
            answer: "dass"
          - question: "Er bleibt zu Hause, _____ er krank ist. (weil)"
            answer: "weil"
          - question: "私はバスで学校へ行きます。(German word order)"
            answer: "Ich gehe mit dem Bus zur Schule."
      - title: "接続法と受動態"
        exercises:
          - question: "Wenn ich Zeit _____, würde ich ein Buch lesen. (haben)"
            answer: "hätte"
          - question: "_____ Sie mir bitte helfen? (können)"
            answer: "Könnten"
          - question: "Das Haus _____ gebaut. (受動態)"
            answer: "wird"
          - question: "Der Brief _____ von meinem Freund geschrieben. (受動態)"
            answer: "wird"
    vocabulary_review:
      - category: "旅行"
        words:
          - "die Reise（旅行）"
          - "der Flughafen（空港）"
          - "der Bahnhof（駅）"
          - "das Hotel（ホテル）"
          - "der Koffer（スーツケース）"
          - "die Fahrkarte / das Ticket（チケット）"
      - category: "レストラン"
        words:
          - "das Restaurant（レストラン）"
          - "die Speisekarte（メニュー）"
          - "bestellen（注文する）"
          - "das Essen（食事）"
          - "die Rechnung（勘定）"
          - "bezahlen（支払う）"
      - category: "健康"
        words:
          - "krank（病気の）"
          - "gesund（健康な）"
          - "der Arzt / die Ärztin（医者）"
          - "das Krankenhaus（病院）"
          - "die Medizin（薬）"
          - "die Schmerzen（痛み）"
    examples:
      - german: "Wenn ich Zeit hätte, würde ich nach Deutschland reisen. Ich würde mit dem Flugzeug fliegen und in einem schönen Hotel übernachten. In Deutschland wird viel Bier getrunken. Ich weiß, dass deutsches Essen sehr lecker ist. Im Restaurant würde ich verschiedene Gerichte bestellen. Ich hoffe, dass ich nicht krank werde, denn ich möchte alles genießen."
        japanese: "もし時間があれば、私はドイツに旅行するでしょう。飛行機で飛んで、素敵なホテルに泊まるでしょう。ドイツではたくさんのビールが飲まれています。ドイツ料理がとてもおいしいことを知っています。レストランでは様々な料理を注文するでしょう。病気にならないことを願っています。なぜなら、私はすべてを楽しみたいからです。"
        audio_file: "example_grammar_review_3.mp3"

  - day: 46
    title: "リスニング強化"
    tasks:
      - name: "基本的なリスニング練習"
        description: "単語や短い文の聞き取り練習を行います。"
      - name: "会話のリスニング練習"
        description: "日常会話や問答のリスニング練習を行います。"
      - name: "リスニング問題の解き方"
        description: "ドイツ語検定のリスニング問題の解き方のコツを学びます。"
    practice:
      - title: "単語と短文のリスニング"
        exercises:
          - task: "数字の聞き取り（1〜100）"
            focus: "数字を正確に聞き取る練習"
          - task: "時間表現の聞き取り"
            focus: "時間や日付の表現を聞き取る練習"
          - task: "基本動詞の聞き取り"
            focus: "日常的な動詞を聞き取る練習"
      - title: "会話のリスニング"
        exercises:
          - task: "自己紹介の聞き取り"
            focus: "名前、出身、職業などの情報を聞き取る練習"
          - task: "買い物の会話"
            focus: "価格、商品、数量などを聞き取る練習"
          - task: "道案内の会話"
            focus: "方向、場所、距離などを聞き取る練習"
      - title: "リスニング問題の解き方"
        tips:
          - "問題文と選択肢を事前によく読んでおく"
          - "キーワードを予測して聞く"
          - "数字、固有名詞、否定表現に特に注意する"
          - "文脈から意味を推測する"
          - "選択肢の中から消去法で答えを絞る"
    vocabulary_review:
      - category: "数字"
        words:
          - "eins, zwei, drei...（1, 2, 3...）"
          - "zwanzig, dreißig, vierzig...（20, 30, 40...）"
          - "hundert, tausend（100, 1000）"
          - "erst-, zweit-, dritt-...（第1, 第2, 第3...）"
      - category: "時間表現"
        words:
          - "Minute, Stunde, Tag（分, 時間, 日）"
          - "Woche, Monat, Jahr（週, 月, 年）"
          - "heute, gestern, morgen（今日, 昨日, 明日）"
          - "früh, spät（早い, 遅い）"
    audio_examples:
      - description: "自己紹介"
        german: "Guten Tag! Ich heiße Thomas Müller. Ich bin 32 Jahre alt und komme aus Berlin. Ich bin Ingenieur und arbeite bei einer Computerfirma. In meiner Freizeit spiele ich gern Fußball und lese Bücher."
        japanese: "こんにちは！私の名前はトーマス・ミュラーです。私は32歳で、ベルリン出身です。私はエンジニアで、コンピュータ会社で働いています。趣味はサッカーをすることと本を読むことです。"
        audio_file: "listening_selbstvorstellung.mp3"
      - description: "買い物の会話"
        german: "A: Guten Tag! Ich hätte gern 200 Gramm Käse und ein Brot, bitte.\nB: Gerne. Welchen Käse möchten Sie? Den Schweizer oder den französischen?\nA: Den Schweizer, bitte.\nB: Sonst noch etwas?\nA: Ja, eine Flasche Milch, bitte.\nB: Das macht zusammen 8 Euro 75."
        japanese: "A: こんにちは！チーズを200グラムとパンを1つください。\nB: かしこまりました。どのチーズがご希望ですか？スイス産かフランス産か？\nA: スイス産をお願いします。\nB: 他に何かありますか？\nA: はい、牛乳を1本ください。\nB: 合計で8ユーロ75セントになります。"
        audio_file: "listening_einkaufen.mp3"
      - description: "道案内"
        german: "A: Entschuldigung, wie komme ich zum Bahnhof?\nB: Gehen Sie diese Straße geradeaus und dann an der zweiten Ampel links. Gehen Sie etwa 200 Meter weiter, dann sehen Sie den Bahnhof auf der rechten Seite.\nA: Wie weit ist es ungefähr?\nB: Zu Fuß etwa 10 Minuten.\nA: Vielen Dank!"
        japanese: "A: すみません、駅にはどう行けばいいですか？\nB: この道をまっすぐ行って、2つ目の信号を左に曲がってください。さらに200メートルほど進むと、右側に駅が見えます。\nA: 大体どのくらいの距離ですか？\nB: 徒歩で約10分です。\nA: どうもありがとうございます！"
        audio_file: "listening_wegbeschreibung.mp3"

  - day: 47
    title: "読解と作文の対策"
    tasks:
      - name: "読解問題の解き方"
        description: "ドイツ語検定の読解問題の解き方のコツを学びます。"
      - name: "短文読解の練習"
        description: "様々なテーマの短い文章を読む練習を行います。"
      - name: "作文の書き方"
        description: "簡単な作文の書き方と表現を学びます。"
    practice:
      - title: "読解のコツ"
        tips:
          - "まず全体を速読して内容を把握する"
          - "わからない単語があっても文脈から推測する"
          - "キーワードとなる単語に注目する"
          - "代名詞が何を指しているか確認する"
          - "接続詞に注意して論理関係を理解する"
      - title: "読解練習"
        exercises:
          - text: "Berlin ist die Hauptstadt von Deutschland. Die Stadt hat etwa 3,7 Millionen Einwohner und ist damit die größte Stadt Deutschlands. Berlin ist bekannt für seine Geschichte, Kultur und Architektur. Viele Touristen besuchen jedes Jahr Berlin."
            questions:
              - question: "Was ist Berlin?"
                answer: "Die Hauptstadt von Deutschland."
              - question: "Wie viele Einwohner hat Berlin?"
                answer: "Etwa 3,7 Millionen."
              - question: "Wofür ist Berlin bekannt?"
                answer: "Für seine Geschichte, Kultur und Architektur."
      - title: "作文のコツ"
        tips:
          - "簡潔で明確な文を書く"
          - "接続詞を使って文をつなげる"
          - "語彙の繰り返しを避ける"
          - "適切な時制を使う"
          - "基本的な文法を守る"
      - title: "作文練習"
        tasks:
          - topic: "自己紹介"
            example: "Ich heiße ... und bin ... Jahre alt. Ich komme aus ... und wohne in ... Ich bin Student/Studentin und lerne Deutsch seit ... Jahren. In meiner Freizeit ..."
          - topic: "趣味について"
            example: "Mein Hobby ist ... Ich ... gern, weil ... Normalerweise ... ich am Wochenende. Es macht mir viel Spaß."
          - topic: "休暇の計画"
            example: "In den Ferien möchte ich ... Ich werde ... und ... Ich freue mich besonders auf ..."
    vocabulary_review:
      - category: "接続詞"
        words:
          - "und（そして）"
          - "aber（しかし）"
          - "oder（または）"
          - "denn（なぜなら）"
          - "weil（〜なので）"
          - "dass（〜ということ）"
          - "wenn（もし〜なら、〜するとき）"
      - category: "趣味"
        words:
          - "lesen（読む）"
          - "Musik hören（音楽を聴く）"
          - "Sport treiben（スポーツをする）"
          - "kochen（料理する）"
          - "reisen（旅行する）"
          - "fotografieren（写真を撮る）"
    examples:
      - title: "読解例"
        text: "München ist die drittgrößte Stadt Deutschlands und die Hauptstadt von Bayern. Die Stadt ist für das Oktoberfest bekannt, das jedes Jahr im September und Oktober stattfindet. Viele Menschen aus aller Welt besuchen dieses Fest. München hat auch viele schöne Museen und Parks."
        audio_file: "example_leseverstaendnis.mp3"
      - title: "作文例"
        text: "Mein Name ist Yuki und ich bin 25 Jahre alt. Ich komme aus Japan und wohne in Tokio. Ich arbeite in einer Firma und lerne Deutsch seit zwei Jahren. Deutsch ist eine interessante Sprache, aber manchmal schwer. In meiner Freizeit lese ich gern Bücher und höre Musik. Am Wochenende treffe ich oft meine Freunde. Wir gehen zusammen ins Kino oder essen in Restaurants."
        audio_file: "example_schreiben.mp3"

  - day: 48
    title: "語彙・文法の総まとめと模擬試験（1）"
    tasks:
      - name: "重要語彙の総まとめ"
        description: "ドイツ語検定3級でよく出る重要語彙を整理します。"
      - name: "重要文法の総まとめ"
        description: "ドイツ語検定3級でよく出る重要文法項目を整理します。"
      - name: "模擬試験（1）"
        description: "筆記試験の模擬テストを行います。"
    practice:
      - title: "重要語彙チェックリスト"
        categories:
          - name: "基本動詞（sein, haben, werden など）"
            mastery_level: "要確認"
          - name: "日常生活の動詞（essen, trinken, schlafen など）"
            mastery_level: "要確認"
          - name: "移動の動詞（gehen, fahren, kommen など）"
            mastery_level: "要確認"
          - name: "感情・思考の動詞（denken, fühlen, meinen など）"
            mastery_level: "要確認"
          - name: "基本名詞（人、場所、時間、物など）"
            mastery_level: "要確認"
          - name: "形容詞・副詞（大きさ、性質、様態など）"
            mastery_level: "要確認"
      - title: "重要文法チェックリスト"
        categories:
          - name: "動詞の時制（現在形、過去形、完了形、未来形）"
            mastery_level: "要確認"
          - name: "格変化（1格、3格、4格）"
            mastery_level: "要確認"
          - name: "冠詞と形容詞の変化"
            mastery_level: "要確認"
          - name: "代名詞（人称代名詞、所有代名詞など）"
            mastery_level: "要確認"
          - name: "接続詞と文の構造"
            mastery_level: "要確認"
          - name: "助動詞、zu不定詞、分離動詞"
            mastery_level: "要確認"
      - title: "模擬試験（筆記）"
        sections:
          - name: "語彙・文法"
            questions: 40
            time: "40分"
            description: "語彙の意味、動詞の活用、格変化、接続詞の使い方などに関する問題"
          - name: "読解"
            questions: 10
            time: "30分"
            description: "短い文章を読んで内容を理解する問題"
          - name: "作文"
            questions: 1
            time: "15分"
            description: "自己紹介や日常的なテーマについての短い作文"
    examples:
      - german: "Die wichtigsten Verben sind: sein, haben, werden, können, müssen, gehen, kommen, machen, sagen, sehen, hören, essen, trinken, schlafen, arbeiten, lernen, wohnen, reisen, kaufen und spielen. Diese Verben solltest du gut lernen und üben."
        japanese: "最も重要な動詞は：sein（〜である）、haben（持っている）、werden（〜になる）、können（できる）、müssen（〜しなければならない）、gehen（行く）、kommen（来る）、machen（する）、sagen（言う）、sehen（見る）、hören（聞く）、essen（食べる）、trinken（飲む）、schlafen（寝る）、arbeiten（働く）、lernen（学ぶ）、wohnen（住む）、reisen（旅行する）、kaufen（買う）、spielen（遊ぶ/演奏する）です。これらの動詞はしっかり学び、練習すべきです。"
        audio_file: "example_wichtige_verben.mp3"

  - day: 49
    title: "模擬試験（2）とリスニング対策"
    tasks:
      - name: "リスニング試験対策"
        description: "ドイツ語検定3級のリスニング試験対策を行います。"
      - name: "模擬試験（2）"
        description: "リスニング試験の模擬テストを行います。"
      - name: "弱点の最終確認"
