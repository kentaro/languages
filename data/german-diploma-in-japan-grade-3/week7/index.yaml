title: "第7週：総復習と試験対策"
description: "これまでに学習した内容を総復習し、独検3級の模擬試験を通じて試験形式に慣れます。弱点を克服し、合格を目指します。"
week_number: 7
daily_goals:
  - day: 43
    title: "文法総復習（格変化・時制）"
    tasks:
      - name: "名詞と冠詞の格変化（1格、3格、4格）"
        description: "名詞と冠詞の格変化を復習します。"
      - name: "形容詞の格変化"
        description: "形容詞の格変化パターンを復習します。"
      - name: "動詞の時制（現在、完了、過去、未来）"
        description: "主要な動詞の時制の形と使い方を復習します。"
    grammar:
      - title: "格変化総まとめ表"
        explanation: "定冠詞・不定冠詞・形容詞・名詞の1格/3格/4格を一覧化して確認します。"
      - title: "時制チャート"
        explanation: "現在形・過去形・完了形・未来形の使い分けと例文を整理します。"
    practice:
      - title: "クイックチェック小テスト"
        description: "10問の穴埋め問題（制限時間10分）で格変化と時制を確認します。"

  - day: 44
    title: "文法総復習（文構造・接続法）"
    tasks:
      - name: "文の種類（平叙文、疑問文、命令文）"
        description: "基本的な文の種類とその語順を復習します。"
      - name: "接続詞と副文"
        description: "主要な接続詞と副文の語順を復習します。"
      - name: "助動詞と話法の助動詞"
        description: "助動詞の使い方と意味を復習します。"
      - name: "接続法Ⅱ式の基本"
        description: "接続法Ⅱ式の基本的な形と使い方を復習します。"
    grammar:
      - title: "副文語順チャート"
        explanation: "従属節の語順と主節の位置を最終確認します。"
      - title: "Konjunktiv II 用例"
        explanation: "接続法Ⅱ式の形を過去形と比較しながら整理します。"
    practice:
      - title: "書き換え演習"
        description: "3文を従属節構造に書き換える練習。"

  - day: 45
    title: "語彙総復習と強化"
    tasks:
      - name: "重要単語の復習"
        description: "これまでに学習した重要単語約700語を復習します。"
      - name: "テーマ別単語の整理"
        description: "日常生活、趣味、旅行など、テーマ別に単語を整理して覚えます。"
      - name: "単語学習ツールでの演習"
        description: "AnkiやMemriseなどのツールを活用し、語彙力強化を図ります。（目標2000語レベル）"
    practice:
      - title: "テーマ別単語クイズ"
        description: "ランダム出題20問で語彙をチェック（Quizletリンク）。"

  - day: 46
    title: "読解練習と模擬試験①"
    tasks:
      - name: "短文読解練習"
        description: "簡単な記事やメールなどの短文を読む練習をします。"
      - name: "長文読解練習（時間計測）"
        description: "試験形式に近い長文を読み、内容理解と時間配分を意識します。"
      - name: "模擬試験（筆記：語彙・文法・読解）"
        description: "模擬試験の筆記パート（語彙・文法・読解）に挑戦し、現状の実力を把握します。"
    practice:
      - title: "読解スキミング練習"
        description: "250語程度の長文でキーワードをマーキングし要旨をつかむ練習。"

  - day: 47
    title: "リスニング練習と模擬試験②"
    tasks:
      - name: "短文リスニング練習"
        description: "短い会話やアナウンスを聞き取る練習をします。"
      - name: "試験形式リスニング練習"
        description: "独検の過去問やサンプル問題を使い、会話の内容や質問の聞き取り、書き取り練習を行います。"
      - name: "模擬試験（聞き取り・作文）"
        description: "模擬試験の聞き取りと作文パートに挑戦します。"
      - name: "簡単なEメール作成練習"
        description: "与えられた状況設定で、簡単なEメールを作成する練習をします。"

  - day: 48
    title: "模擬試験③と弱点分析"
    tasks:
      - name: "重要語彙の総まとめ"
        description: "ドイツ語検定3級でよく出る重要語彙を整理します。"
      - name: "重要文法の総まとめ"
        description: "ドイツ語検定3級でよく出る重要文法項目を整理します。"
      - name: "模擬試験（1）"
        description: "筆記試験の模擬テストを行います。"
    practice:
      - title: "重要語彙チェックリスト"
        categories:
          - name: "基本動詞（sein, haben, werden など）"
            mastery_level: "要確認"
          - name: "日常生活の動詞（essen, trinken, schlafen など）"
            mastery_level: "要確認"
          - name: "移動の動詞（gehen, fahren, kommen など）"
            mastery_level: "要確認"
          - name: "感情・思考の動詞（denken, fühlen, meinen など）"
            mastery_level: "要確認"
          - name: "基本名詞（人、場所、時間、物など）"
            mastery_level: "要確認"
          - name: "形容詞・副詞（大きさ、性質、様態など）"
            mastery_level: "要確認"
      - title: "重要文法チェックリスト"
        categories:
          - name: "動詞の時制（現在形、過去形、完了形、未来形）"
            mastery_level: "要確認"
          - name: "格変化（1格、3格、4格）"
            mastery_level: "要確認"
          - name: "冠詞と形容詞の変化"
            mastery_level: "要確認"
          - name: "代名詞（人称代名詞、所有代名詞など）"
            mastery_level: "要確認"
          - name: "接続詞と文の構造"
            mastery_level: "要確認"
          - name: "助動詞、zu不定詞、分離動詞"
            mastery_level: "要確認"
      - title: "模擬試験（筆記）"
        sections:
          - name: "語彙・文法"
            questions: 40
            time: "40分"
            description: "語彙の意味、動詞の活用、格変化、接続詞の使い方などに関する問題"
          - name: "読解"
            questions: 10
            time: "30分"
            description: "短い文章を読んで内容を理解する問題"
          - name: "作文"
            questions: 1
            time: "15分"
            description: "自己紹介や日常的なテーマについての短い作文"
    examples:
      - german: "Die wichtigsten Verben sind: sein, haben, werden, können, müssen, gehen, kommen, machen, sagen, sehen, hören, essen, trinken, schlafen, arbeiten, lernen, wohnen, reisen, kaufen und spielen. Diese Verben solltest du gut lernen und üben."
        japanese: "最も重要な動詞は：sein（〜である）、haben（持っている）、werden（〜になる）、können（できる）、müssen（〜しなければならない）、gehen（行く）、kommen（来る）、machen（する）、sagen（言う）、sehen（見る）、hören（聞く）、essen（食べる）、trinken（飲む）、schlafen（寝る）、arbeiten（働く）、lernen（学ぶ）、wohnen（住む）、reisen（旅行する）、kaufen（買う）、spielen（遊ぶ/演奏する）です。これらの動詞はしっかり学び、練習すべきです。"
        audio_file: "example_wichtige_verben.mp3"

  - day: 49
    title: "模擬試験（2）とリスニング対策"
    tasks:
      - name: "リスニング試験対策"
        description: "ドイツ語検定3級のリスニング試験対策を行います。"
      - name: "模擬試験（2）"
        description: "リスニング試験の模擬テストを行います。"
      - name: "弱点の最終確認"
        description: "これまでの学習で見つかった弱点を最終確認します。"
    practice:
      - title: "リスニング対策"
        tips:
          - "試験前に複数の例題を聴いておく"
          - "数字、時間、場所の表現に慣れておく"
          - "重要な語彙を聞き取れるよう練習する"
          - "ネイティブの発音に慣れておく"
          - "集中力を保つ方法を身につける"
      - title: "模擬試験（リスニング）"
        sections:
          - name: "リスニング"
            questions: 20
            time: "約30分"
            description: "日常会話、アナウンス、短い説明などを聞いて内容を理解する問題"
      - title: "弱点チェックリスト"
        categories:
          - name: "語彙力"
            improvement_strategy: "単語帳の繰り返し練習、例文での確認"
          - name: "文法理解"
            improvement_strategy: "弱点文法の集中復習、問題演習"
          - name: "リスニング"
            improvement_strategy: "多くの音声を聴く、ディクテーション練習"
          - name: "読解力"
            improvement_strategy: "様々な文章を読む、キーワード抽出練習"
          - name: "作文力"
            improvement_strategy: "模範文を参考に書く練習、文法ミスの確認"
    audio_examples:
      - description: "アナウンス"
        german: "Achtung, Achtung! Der Zug nach Berlin fährt heute von Gleis 5 ab. Die Abfahrt ist um 14 Uhr 35. Bitte steigen Sie jetzt ein. Der nächste Zug nach Berlin fährt erst um 16 Uhr 20."
        japanese: "ご注意ください！ベルリン行きの列車は本日5番線から発車します。出発は14時35分です。今すぐご乗車ください。次のベルリン行き列車は16時20分までありません。"
        audio_file: "listening_durchsage.mp3"
      - description: "天気予報"
        german: "Hier ist der Wetterbericht für morgen: Es wird sonnig und warm mit Temperaturen zwischen 20 und 25 Grad. Am Nachmittag können einzelne Wolken aufziehen. Am Abend wird es etwas kühler mit etwa 18 Grad. Für Freitag erwarten wir Regen."
        japanese: "明日の天気予報です：晴れて暖かく、気温は20度から25度の間です。午後には雲が出てくることがあります。夕方は少し涼しくなり、約18度になります。金曜日は雨が予想されます。"
        audio_file: "listening_wetterbericht.mp3"
      - description: "会話"
        german: "A: Entschuldigung, haben Sie ein Zimmer frei für zwei Nächte?\nB: Ja, wir haben noch ein Einzelzimmer und ein Doppelzimmer.\nA: Wie viel kostet das Doppelzimmer pro Nacht?\nB: 85 Euro mit Frühstück.\nA: Gut, ich nehme das Doppelzimmer für zwei Nächte.\nB: Sehr gut. Könnten Sie bitte Ihren Namen und Ihre Telefonnummer angeben?"
        japanese: "A: すみません、2泊の空き部屋はありますか？\nB: はい、シングルルームとダブルルームがまだあります。\nA: ダブルルームは1泊いくらですか？\nB: 朝食付きで85ユーロです。\nA: わかりました、2泊分のダブルルームを取ります。\nB: かしこまりました。お名前と電話番号をお知らせいただけますか？"
        audio_file: "listening_hotelgespraech.mp3"

  - day: 50
    title: "最終確認と試験直前対策"
    tasks:
      - name: "試験の流れとポイントの確認"
        description: "試験の構成、時間配分、解答の仕方などを確認します。"
      - name: "よくある問題パターンの確認"
        description: "ドイツ語検定3級でよく出る問題パターンを確認します。"
      - name: "試験直前の準備"
        description: "試験当日に必要なものや注意事項を確認します。"
    tips:
      - title: "試験時の注意点"
        points:
          - "試験の指示をよく読む"
          - "解答用紙の記入方法を確認する"
          - "時間配分に気をつける"
          - "わからない問題は飛ばして後で戻る"
          - "見直す時間を確保する"
          - "リスニングでは集中して聞く"
      - title: "よくある問題パターン"
        patterns:
          - "動詞の活用（時制、人称変化）"
          - "冠詞と名詞の格変化"
          - "形容詞の格変化と比較変化"
          - "前置詞の使い分け"
          - "語順（副文、疑問文など）"
          - "接続詞の使い方"
      - title: "試験直前の準備"
        checklist:
          - "受験票"
          - "筆記用具（黒の鉛筆・消しゴム）"
          - "時計（音が出ないもの）"
          - "会場の場所と行き方の確認"
          - "十分な睡眠"
          - "余裕を持った行動"
    motivation:
      - "これまでの50日間、よく頑張りました！"
      - "学んだことを自信を持って試験で発揮しましょう。"
      - "失敗を恐れず、知っていることに集中しましょう。"
      - "試験は実力を試す良い機会です。リラックスして挑みましょう。"
      - "試験後も続けてドイツ語を学び続けることが大切です。"
    final_review:
      - german: "Ich habe in den letzten 50 Tagen viel Deutsch gelernt. Ich kenne jetzt die wichtigsten Grammatikregeln und viele nützliche Wörter. Ich kann einfache Gespräche führen und Texte verstehen. Ich bin bereit für die Prüfung und werde mein Bestes geben!"
        japanese: "この50日間で私はたくさんのドイツ語を学びました。今は最も重要な文法規則と多くの役立つ単語を知っています。簡単な会話をしたり、文章を理解したりできます。試験の準備はできています。ベストを尽くします！"
        audio_file: "example_final_review.mp3"

weekly_review:
  summary: "最終週では、これまでに学習してきた文法、語彙、リスニング、読解、作文のすべての要素を総復習しました。また、模擬試験を通じて実際の試験形式に慣れるとともに、弱点を把握して強化することができました。いよいよドイツ語検定3級の受験に向けた準備が整いました。"
  key_points:
    - "文法面では、動詞の時制、格変化、冠詞と形容詞の変化、文の構造などの重要項目を確認しました。"
    - "語彙面では、基本的な単語から場面別の表現まで、幅広い語彙を整理しました。"
    - "リスニングでは、様々な状況の会話や説明を聴く練習を重ね、聞き取りのコツを学びました。"
    - "読解と作文では、文章の理解の仕方や効果的な表現方法を練習しました。"
    - "試験対策では、時間配分や解答のテクニック、直前の準備などを確認しました。"
  next_steps: "ドイツ語検定3級に合格したら、さらに上のレベルを目指して学習を続けましょう。日常的にドイツ語に触れる機会を作り、実際のコミュニケーションの中でドイツ語を使うことで、より自然で実用的なドイツ語力を身につけることができます。" 