title: "第2週：文の構造と基本表現"
description: "ドイツ語の文の構造や基本表現を学習します。名詞の3格、前置詞、疑問詞と疑問文、命令形を中心に学びます。"
week_number: 2
daily_goals:
  - day: 8
    title: "名詞の格変化（3格）"
    tasks:
      - name: "3格（与格）の基本"
        description: "間接目的語として使われる3格の基本を学習します。"
      - name: "3格を取る動詞"
        description: "3格目的語を取る基本的な動詞を学習します。"
    grammar:
      - title: "3格（与格）の基本"
        explanation: "3格（与格）は間接目的語を示します。「〜に」という意味を表し、行為の受け手を示すことが多いです。"
      - title: "定冠詞の格変化（3格）"
        table:
          - gender: "男性名詞"
            nominative: "der"
            accusative: "den"
            dative: "dem"
          - gender: "女性名詞"
            nominative: "die"
            accusative: "die"
            dative: "der"
          - gender: "中性名詞"
            nominative: "das"
            accusative: "das"
            dative: "dem"
          - gender: "複数形"
            nominative: "die"
            accusative: "die"
            dative: "den + n"
      - title: "不定冠詞の格変化（3格）"
        table:
          - gender: "男性名詞"
            nominative: "ein"
            accusative: "einen"
            dative: "einem"
          - gender: "女性名詞"
            nominative: "eine"
            accusative: "eine"
            dative: "einer"
          - gender: "中性名詞"
            nominative: "ein"
            accusative: "ein"
            dative: "einem"
    vocabulary:
      - word: "helfen"
        pronunciation: "ヘルフェン"
        meaning: "手伝う、助ける"
        audio_file: "helfen.mp3"
      - word: "danken"
        pronunciation: "ダンケン"
        meaning: "感謝する"
        audio_file: "danken.mp3"
      - word: "antworten"
        pronunciation: "アントヴォルテン"
        meaning: "答える"
        audio_file: "antworten.mp3"
      - word: "gefallen"
        pronunciation: "ゲファレン"
        meaning: "気に入る"
        audio_file: "gefallen.mp3"
      - word: "gehören"
        pronunciation: "ゲヘーレン"
        meaning: "〜のものである"
        audio_file: "gehoeren.mp3"
    examples:
      - german: "Ich helfe dem Kind."
        japanese: "私はその子供を手伝います。"
        audio_file: "example_helfen.mp3"
      - german: "Er antwortet der Frau."
        japanese: "彼はその女性に答えます。"
        audio_file: "example_antworten.mp3"
      - german: "Wir danken dem Lehrer."
        japanese: "私たちはその先生に感謝します。"
        audio_file: "example_danken.mp3"
      - german: "Das Buch gefällt einem Studenten."
        japanese: "その本はある学生の気に入っています。"
        audio_file: "example_gefallen.mp3"

  - day: 9
    title: "3格と4格を取る動詞"
    tasks:
      - name: "3格と4格の両方を取る動詞"
        description: "間接目的語（3格）と直接目的語（4格）の両方を取る動詞を学習します。"
      - name: "3格と4格の語順"
        description: "3格と4格の目的語が共に出てくる場合の語順について学習します。"
    grammar:
      - title: "3格と4格を取る動詞の例"
        explanation: "いくつかの動詞は間接目的語（3格）と直接目的語（4格）の両方を取ります。基本的に「誰に」（3格）「何を」（4格）という構造になります。"
        examples:
          - "geben（与える）: Ich gebe dem Kind einen Apfel.（私はその子供にリンゴを与えます。）"
          - "schenken（贈る）: Er schenkt der Frau eine Blume.（彼はその女性に花を贈ります。）"
          - "zeigen（見せる）: Sie zeigt dem Mann das Bild.（彼女はその男性に絵を見せます。）"
      - title: "3格と4格の語順"
        explanation: "基本的に、3格の目的語は4格の目的語の前に置きます。ただし、4格が代名詞の場合は、4格の代名詞が3格の目的語の前に来ます。"
        examples:
          - "Ich gebe dem Kind einen Apfel.（私はその子供にリンゴを与えます。）"
          - "Ich gebe ihn dem Kind.（私はそれをその子供に与えます。）"
    vocabulary:
      - word: "geben"
        pronunciation: "ゲーベン"
        meaning: "与える"
        audio_file: "geben.mp3"
      - word: "schenken"
        pronunciation: "シェンケン"
        meaning: "贈る"
        audio_file: "schenken.mp3"
      - word: "zeigen"
        pronunciation: "ツァイゲン"
        meaning: "見せる"
        audio_file: "zeigen.mp3"
      - word: "erklären"
        pronunciation: "エアクレーレン"
        meaning: "説明する"
        audio_file: "erklaeren.mp3"
      - word: "bringen"
        pronunciation: "ブリンゲン"
        meaning: "持ってくる"
        audio_file: "bringen.mp3"
    examples:
      - german: "Ich gebe meiner Mutter ein Geschenk."
        japanese: "私は母にプレゼントをあげます。"
        audio_file: "example_geben.mp3"
      - german: "Er zeigt den Kindern ein Buch."
        japanese: "彼は子供たちに本を見せます。"
        audio_file: "example_zeigen.mp3"
      - german: "Sie erklärt dem Studenten die Grammatik."
        japanese: "彼女は学生に文法を説明します。"
        audio_file: "example_erklaeren.mp3"
      - german: "Ich bringe dir einen Kaffee."
        japanese: "私はあなたにコーヒーを持ってきます。"
        audio_file: "example_bringen.mp3"

  - day: 10
    title: "前置詞（基本的な空間表現）"
    tasks:
      - name: "空間を表す前置詞"
        description: "場所や位置関係を表す基本的な前置詞を学習します。"
      - name: "前置詞と格の関係"
        description: "前置詞によって決まる格（3格・4格）について学習します。"
    grammar:
      - title: "3格を取る前置詞"
        explanation: "以下の前置詞は常に3格を取ります："
        items:
          - "aus（〜から出て）"
          - "bei（〜のところで）"
          - "mit（〜と一緒に）"
          - "nach（〜の後に、〜へ）"
          - "von（〜から）"
          - "zu（〜へ）"
      - title: "4格を取る前置詞"
        explanation: "以下の前置詞は常に4格を取ります："
        items:
          - "durch（〜を通って）"
          - "für（〜のために）"
          - "gegen（〜に対して）"
          - "ohne（〜なしで）"
          - "um（〜の周りに）"
      - title: "3格/4格両方を取る前置詞"
        explanation: "以下の前置詞は、状況によって3格または4格を取ります："
        items:
          - "in（〜の中に/中で）: 移動を表す場合は4格、位置を表す場合は3格"
          - "an（〜の側に/側で）: 移動を表す場合は4格、位置を表す場合は3格"
          - "auf（〜の上に/上で）: 移動を表す場合は4格、位置を表す場合は3格"
    vocabulary:
      - word: "in"
        pronunciation: "イン"
        meaning: "〜の中に/中で"
        audio_file: "in.mp3"
      - word: "auf"
        pronunciation: "アウフ"
        meaning: "〜の上に/上で"
        audio_file: "auf.mp3"
      - word: "an"
        pronunciation: "アン"
        meaning: "〜の側に/側で"
        audio_file: "an.mp3"
      - word: "unter"
        pronunciation: "ウンター"
        meaning: "〜の下に/下で"
        audio_file: "unter.mp3"
      - word: "neben"
        pronunciation: "ネーベン"
        meaning: "〜の隣に/隣で"
        audio_file: "neben.mp3"
    examples:
      - german: "Das Buch liegt auf dem Tisch."
        japanese: "その本はテーブルの上にあります。（位置→3格）"
        audio_file: "example_auf_3.mp3"
      - german: "Ich lege das Buch auf den Tisch."
        japanese: "私はその本をテーブルの上に置きます。（移動→4格）"
        audio_file: "example_auf_4.mp3"
      - german: "Er wohnt in Deutschland."
        japanese: "彼はドイツに住んでいます。（位置→3格）"
        audio_file: "example_in_3.mp3"
      - german: "Sie geht in die Schule."
        japanese: "彼女は学校に行きます。（移動→4格）"
        audio_file: "example_in_4.mp3"

  - day: 11
    title: "前置詞（基本的な時間表現）"
    tasks:
      - name: "時間を表す前置詞"
        description: "時間や期間を表す基本的な前置詞を学習します。"
      - name: "曜日・月・季節の表現"
        description: "曜日、月、季節の言い方と関連する前置詞を学習します。"
    grammar:
      - title: "時間を表す前置詞"
        items:
          - "am（〜に）: 曜日、時刻（am Montag, am Morgen）"
          - "um（〜時に）: 時刻（um 8 Uhr）"
          - "im（〜に）: 月、季節（im Januar, im Sommer）"
          - "in（〜後に）: 期間（in einer Stunde）"
          - "seit（〜以来）: 継続（seit drei Jahren）"
          - "vor（〜前に）: 時間的な前（vor zwei Tagen）"
          - "nach（〜後に）: 時間的な後（nach dem Unterricht）"
      - title: "曜日"
        items:
          - "Montag（月曜日）"
          - "Dienstag（火曜日）"
          - "Mittwoch（水曜日）"
          - "Donnerstag（木曜日）"
          - "Freitag（金曜日）"
          - "Samstag/Sonnabend（土曜日）"
          - "Sonntag（日曜日）"
      - title: "月"
        items:
          - "Januar（1月）"
          - "Februar（2月）"
          - "März（3月）"
          - "April（4月）"
          - "Mai（5月）"
          - "Juni（6月）"
          - "Juli（7月）"
          - "August（8月）"
          - "September（9月）"
          - "Oktober（10月）"
          - "November（11月）"
          - "Dezember（12月）"
      - title: "季節"
        items:
          - "der Frühling（春）"
          - "der Sommer（夏）"
          - "der Herbst（秋）"
          - "der Winter（冬）"
    vocabulary:
      - word: "die Zeit"
        pronunciation: "ディ ツァイト"
        meaning: "時間"
        audio_file: "die_zeit.mp3"
      - word: "die Stunde"
        pronunciation: "ディ シュトゥンデ"
        meaning: "1時間"
        audio_file: "die_stunde.mp3"
      - word: "die Minute"
        pronunciation: "ディ ミヌーテ"
        meaning: "1分"
        audio_file: "die_minute.mp3"
      - word: "der Tag"
        pronunciation: "デア ターク"
        meaning: "日"
        audio_file: "der_tag.mp3"
      - word: "die Woche"
        pronunciation: "ディ ヴォッヘ"
        meaning: "週"
        audio_file: "die_woche.mp3"
    examples:
      - german: "Ich gehe am Montag ins Kino."
        japanese: "私は月曜日に映画館に行きます。"
        audio_file: "example_am_montag.mp3"
      - german: "Die Schule beginnt um 8 Uhr."
        japanese: "学校は8時に始まります。"
        audio_file: "example_um_8.mp3"
      - german: "Im Sommer ist es sehr heiß."
        japanese: "夏はとても暑いです。"
        audio_file: "example_im_sommer.mp3"
      - german: "Ich komme in 10 Minuten."
        japanese: "私は10分後に来ます。"
        audio_file: "example_in_10.mp3"

  - day: 12
    title: "疑問詞と疑問文"
    tasks:
      - name: "基本的な疑問詞"
        description: "wer, was, wann, wo, wohin, woher, wie, warum などの疑問詞を学習します。"
      - name: "疑問文の作り方"
        description: "文頭に動詞を置く疑問文と、疑問詞を使う疑問文の作り方を学習します。"
    grammar:
      - title: "基本的な疑問詞"
        table:
          - word: "wer"
            meaning: "誰が（1格）"
            example: "Wer ist das?（それは誰ですか？）"
          - word: "wen"
            meaning: "誰を（4格）"
            example: "Wen siehst du?（あなたは誰を見ますか？）"
          - word: "wem"
            meaning: "誰に（3格）"
            example: "Wem gehört das Buch?（その本は誰のものですか？）"
          - word: "was"
            meaning: "何が、何を"
            example: "Was machst du?（あなたは何をしていますか？）"
          - word: "wo"
            meaning: "どこで"
            example: "Wo wohnst du?（あなたはどこに住んでいますか？）"
          - word: "wohin"
            meaning: "どこへ"
            example: "Wohin gehst du?（あなたはどこへ行きますか？）"
          - word: "woher"
            meaning: "どこから"
            example: "Woher kommst du?（あなたはどこから来ましたか？）"
          - word: "wann"
            meaning: "いつ"
            example: "Wann kommst du?（あなたはいつ来ますか？）"
          - word: "wie"
            meaning: "どのように、どんな風に"
            example: "Wie heißt du?（あなたの名前は何ですか？）"
          - word: "warum"
            meaning: "なぜ"
            example: "Warum lernst du Deutsch?（なぜあなたはドイツ語を学んでいるのですか？）"
          - word: "wie viel / wie viele"
            meaning: "いくら・いくつ"
            example: "Wie viel kostet das?（それはいくらですか？）"
      - title: "疑問文の種類"
        items:
          - "決定疑問文（はい・いいえで答える疑問文）：文頭に動詞を置きます。例：Lernst du Deutsch?（あなたはドイツ語を学んでいますか？）"
          - "疑問詞疑問文（疑問詞で始まる疑問文）：文頭に疑問詞、その後に動詞を置きます。例：Wo wohnst du?（あなたはどこに住んでいますか？）"
    vocabulary:
      - word: "die Frage"
        pronunciation: "ディ フラーゲ"
        meaning: "質問"
        audio_file: "die_frage.mp3"
      - word: "die Antwort"
        pronunciation: "ディ アントヴォルト"
        meaning: "答え"
        audio_file: "die_antwort.mp3"
      - word: "fragen"
        pronunciation: "フラーゲン"
        meaning: "質問する"
        audio_file: "fragen.mp3"
      - word: "verstehen"
        pronunciation: "フェアシュテーエン"
        meaning: "理解する"
        audio_file: "verstehen.mp3"
      - word: "kennen"
        pronunciation: "ケネン"
        meaning: "知っている"
        audio_file: "kennen.mp3"
    examples:
      - german: "Wie heißen Sie?—Ich heiße Schmidt."
        japanese: "お名前は何ですか？—私の名前はシュミットです。"
        audio_file: "example_wie_heissen.mp3"
      - german: "Woher kommen Sie?—Ich komme aus Japan."
        japanese: "どちらから来られましたか？—私は日本から来ました。"
        audio_file: "example_woher.mp3"
      - german: "Was machst du am Wochenende?—Ich gehe ins Kino."
        japanese: "週末に何をしますか？—映画館に行きます。"
        audio_file: "example_was_machst.mp3"
      - german: "Sprichst du Englisch?—Ja, ein bisschen."
        japanese: "あなたは英語を話しますか？—はい、少しです。"
        audio_file: "example_sprichst.mp3"

  - day: 13
    title: "命令形"
    tasks:
      - name: "命令形の作り方"
        description: "du, ihr, Sieに対する命令形の作り方を学習します。"
      - name: "日常的によく使う命令表現"
        description: "頻繁に使われる命令表現を学習します。"
    grammar:
      - title: "命令形の基本"
        explanation: "命令形は指示や要求を表すときに使います。相手（du, ihr, Sie）によって形が変わります。"
      - title: "命令形の作り方"
        table:
          - person: "du（親しい一人称）"
            formation: "動詞の語幹（語尾なし、ただし語幹が-d, -t, -n, -mで終わる場合は-e付加）"
            examples: "Komm! (kommen), Arbeite! (arbeiten)"
          - person: "ihr（親しい複数人）"
            formation: "動詞の現在形ihr人称と同じ（-t）"
            examples: "Kommt! (kommen), Arbeitet! (arbeiten)"
          - person: "Sie（敬称、一人または複数）"
            formation: "Sie + 動詞の原形"
            examples: "Kommen Sie! (kommen), Arbeiten Sie! (arbeiten)"
      - title: "不規則動詞の命令形（du人称）"
        explanation: "いくつかの不規則動詞は命令形が特殊になります。"
        examples:
          - "sein → Sei! （〜であれ）"
          - "haben → Hab(e)! （持て）"
          - "werden → Werde! （〜になれ）"
          - "lesen → Lies! （読め）"
          - "geben → Gib! （与えよ）"
    vocabulary:
      - word: "gehen"
        pronunciation: "ゲーエン"
        meaning: "行く"
        audio_file: "gehen.mp3"
      - word: "warten"
        pronunciation: "ヴァルテン"
        meaning: "待つ"
        audio_file: "warten.mp3"
      - word: "hören"
        pronunciation: "ヘーレン"
        meaning: "聞く"
        audio_file: "hoeren.mp3"
      - word: "schreiben"
        pronunciation: "シュライベン"
        meaning: "書く"
        audio_file: "schreiben.mp3"
      - word: "vergessen"
        pronunciation: "フェアゲッセン"
        meaning: "忘れる"
        audio_file: "vergessen.mp3"
    examples:
      - german: "Komm schnell!"
        japanese: "早く来て！"
        audio_file: "example_komm.mp3"
      - german: "Warte hier!"
        japanese: "ここで待って！"
        audio_file: "example_warte.mp3"
      - german: "Hört gut zu!"
        japanese: "よく聞いて！（複数人に）"
        audio_file: "example_hoert.mp3"
      - german: "Sprechen Sie bitte langsamer!"
        japanese: "もう少しゆっくり話してください！（敬称）"
        audio_file: "example_sprechen_sie.mp3"
      - german: "Vergiss es nicht!"
        japanese: "それを忘れないで！"
        audio_file: "example_vergiss.mp3"

  - day: 14
    title: "第2週の総復習"
    tasks:
      - name: "格変化の復習（1格、3格、4格）"
        description: "これまでに学んだ格変化（1格、3格、4格）を復習します。"
      - name: "前置詞の復習"
        description: "空間と時間を表す前置詞を復習します。"
      - name: "疑問文と命令形の復習"
        description: "疑問詞と疑問文の作り方、命令形の作り方を復習します。"
    practice:
      - title: "格変化の練習"
        exercises:
          - question: "Ich gebe _____ _____ (der Mann) ein Buch."
            answer: "dem Mann"
          - question: "Er hilft _____ _____ (die Frau)."
            answer: "der Frau"
          - question: "Wir sehen _____ _____ (das Kind)."
            answer: "das Kind"
          - question: "Sie gibt _____ _____ (die Kinder) Geschenke."
            answer: "den Kindern"
      - title: "前置詞の練習"
        exercises:
          - question: "Das Buch liegt _____ _____ _____ (auf + der + Tisch)."
            answer: "auf dem Tisch"
          - question: "Wir gehen _____ _____ _____ (in + das + Kino)."
            answer: "in das Kino (= ins Kino)"
          - question: "Sie kommt _____ Deutschland."
            answer: "aus"
          - question: "Der Unterricht beginnt _____ 9 Uhr."
            answer: "um"
      - title: "疑問文と命令形の練習"
        exercises:
          - question: "_____ wohnst du? —In Berlin."
            answer: "Wo"
          - question: "_____ heißen Sie? —Ich heiße Müller."
            answer: "Wie"
          - question: "Mach das Fenster auf! → Sie人称の命令形"
            answer: "Machen Sie das Fenster auf!"
          - question: "Komm her! → ihr人称の命令形"
            answer: "Kommt her!"
    examples:
      - german: "Ich wohne seit zwei Jahren in Deutschland. Am Wochenende gehe ich oft mit meinen Freunden ins Kino oder ins Restaurant. Komm doch mal zu mir! Meine Wohnung ist nicht weit von der U-Bahn-Station."
        japanese: "私は2年前からドイツに住んでいます。週末にはよく友達と映画館やレストランに行きます。ぜひ一度私のところに来てください！私のアパートは地下鉄の駅から遠くありません。"
        audio_file: "example_week2_review.mp3"

weekly_review:
  summary: "今週は、ドイツ語の文の構造をより深く理解するために、名詞の3格、前置詞、疑問詞と疑問文、命令形を学びました。これらの文法事項を使うことで、より複雑で自然なドイツ語の文章を作れるようになりました。"
  key_points:
    - "3格（与格）は間接目的語を示し、男性・中性名詞は dem、女性名詞は der、複数形は den（+語尾 n）となります。"
    - "前置詞には3格を取るもの、4格を取るもの、状況によって3格か4格を取るものの3種類があります。"
    - "疑問詞（wer, was, wo など）を使った疑問文では、疑問詞を文頭に置き、その後に動詞が来ます。"
    - "命令形は指示や要求を表し、相手（du, ihr, Sie）によって形が変わります。"
  next_steps: "次週は、過去形（完了形と過去形）、助動詞（können, müssen など）、分離動詞、未来形を学びます。これにより、過去の出来事や能力、義務、予定などを表現できるようになります。" 