  - day: 27
    title: "形容詞の格変化（基本）"
    tasks:
      - name: "形容詞の基本的な使い方"
        description: "述語的用法と付加語的用法の違いを学習します。"
      - name: "定冠詞類と共に使う形容詞の格変化"
        description: "定冠詞や指示代名詞の後に来る形容詞の格変化を学習します。"
    grammar:
      - title: "形容詞の用法"
        explanation: "形容詞には、述語的用法（述語として使う）と付加語的用法（名詞を修飾する）の2種類があります。述語的用法では形容詞は変化せず、付加語的用法では名詞の性・数・格に合わせて変化します。"
        examples:
          - "述語的用法：Der Tisch ist groß.（そのテーブルは大きいです。）"
          - "付加語的用法：Das ist ein großer Tisch.（それは大きなテーブルです。）"
      - title: "定冠詞類と共に使う形容詞の格変化（1格と4格）"
        explanation: "定冠詞、指示代名詞（dieser, jeder など）の後に形容詞が来る場合、形容詞は弱変化します。"
        table:
          - case: "1格 男性"
            pattern: "-e"
            example: "der große Tisch（その大きなテーブル）"
          - case: "1格 女性"
            pattern: "-e"
            example: "die schöne Blume（その美しい花）"
          - case: "1格 中性"
            pattern: "-e"
            example: "das kleine Kind（その小さな子供）"
          - case: "1格 複数"
            pattern: "-en"
            example: "die alten Bücher（その古い本たち）"
          - case: "4格 男性"
            pattern: "-en"
            example: "den großen Tisch（その大きなテーブルを）"
          - case: "4格 女性"
            pattern: "-e"
            example: "die schöne Blume（その美しい花を）"
          - case: "4格 中性"
            pattern: "-e"
            example: "das kleine Kind（その小さな子供を）"
          - case: "4格 複数"
            pattern: "-en"
            example: "die alten Bücher（その古い本たちを）"
    vocabulary:
      - word: "groß"
        pronunciation: "グロース"
        meaning: "大きい"
        audio_file: "gross.mp3"
      - word: "klein"
        pronunciation: "クライン"
        meaning: "小さい"
        audio_file: "klein.mp3"
      - word: "alt"
        pronunciation: "アルト"
        meaning: "古い、年老いた"
        audio_file: "alt.mp3"
      - word: "neu"
        pronunciation: "ノイ"
        meaning: "新しい"
        audio_file: "neu.mp3"
      - word: "schön"
        pronunciation: "シェーン"
        meaning: "美しい"
        audio_file: "schoen.mp3"
      - word: "gut"
        pronunciation: "グート"
        meaning: "良い"
        audio_file: "gut.mp3"
      - word: "interessant"
        pronunciation: "インテレサント"
        meaning: "面白い"
        audio_file: "interessant.mp3"
    examples:
      - german: "Das ist ein großer Tisch. Der große Tisch ist neu."
        japanese: "これは大きなテーブルです。その大きなテーブルは新しいです。"
        audio_file: "example_grosser_tisch.mp3"
      - german: "Ich kaufe die rote Tasche."
        japanese: "私はその赤いバッグを買います。"
        audio_file: "example_rote_tasche.mp3"
      - german: "Das kleine Kind spielt im Garten."
        japanese: "その小さな子供は庭で遊んでいます。"
        audio_file: "example_kleine_kind.mp3"
      - german: "Wir lesen die interessanten Bücher."
        japanese: "私たちはその面白い本たちを読みます。"
        audio_file: "example_interessanten_buecher.mp3"
      - german: "Sie trägt den schwarzen Mantel."
        japanese: "彼女はその黒いコートを着ています。"
        audio_file: "example_schwarzen_mantel.mp3"

  - day: 28
    title: "第4週の総復習"
    tasks:
      - name: "接続詞と副文の復習"
        description: "並列接続詞と副文を導く接続詞、および副文の語順を復習します。"
      - name: "代名詞の復習"
        description: "人称代名詞と所有代名詞の格変化を復習します。"
      - name: "形容詞の格変化の復習"
        description: "定冠詞類と共に使う形容詞の格変化を復習します。"
    practice:
      - title: "接続詞と文の作成"
        exercises:
          - question: "Ich gehe ins Kino. Mein Freund bleibt zu Hause. (und)"
            answer: "Ich gehe ins Kino und mein Freund bleibt zu Hause."
          - question: "Ich weiß. Er kommt morgen. (dass)"
            answer: "Ich weiß, dass er morgen kommt."
          - question: "Er bleibt zu Hause. Er ist krank. (weil)"
            answer: "Er bleibt zu Hause, weil er krank ist."
          - question: "Es regnet. Wir gehen spazieren. (trotzdem)"
            answer: "Es regnet, trotzdem gehen wir spazieren."
      - title: "代名詞の練習"
        exercises:
          - question: "Gibst du _____ (ich) das Buch?"
            answer: "mir"
          - question: "Ich sehe _____ (du) nicht."
            answer: "dich"
          - question: "Er gibt _____ (wir) die Bücher."
            answer: "uns"
          - question: "Das ist _____ (ich) Vater."
            answer: "mein"
          - question: "Wir sehen _____ (ihr) Haus."
            answer: "euer"
      - title: "形容詞の格変化"
        exercises:
          - question: "Das ist ein _____ (groß) Tisch."
            answer: "großer"
          - question: "Ich sehe den _____ (alt) Mann."
            answer: "alten"
          - question: "Das _____ (klein) Kind spielt."
            answer: "kleine"
          - question: "Die _____ (jung) Frau ist Lehrerin."
            answer: "junge"
    examples:
      - german: "Ich weiß, dass er heute kommt, aber ich habe keine Zeit, weil ich arbeiten muss. Mein Bruder kann ihm helfen. Der nette Mann ist mein Onkel. Ich gebe ihm das große Geschenk."
        japanese: "私は彼が今日来ることを知っていますが、働かなければならないので時間がありません。私の兄は彼を手伝うことができます。その親切な男性は私の叔父です。私は彼にその大きなプレゼントをあげます。"
        audio_file: "example_week4_review.mp3"

weekly_review:
  summary: "今週は、ドイツ語の複文（接続詞と副文）と代名詞（人称代名詞・所有代名詞）について学習しました。また、形容詞の格変化の基本も身につけました。これらの文法要素を使うことで、より複雑で自然なドイツ語の文章を作れるようになりました。"
  key_points:
    - "並列接続詞（und, aber, oder など）は、同等の2つの文をつなぎ、文の語順には影響しません。"
    - "副文を導く接続詞（dass, weil, wenn など）の後では、動詞が文末に来ます。"
    - "人称代名詞は格（1格、3格、4格）によって形が変わります。"
    - "所有代名詞は所有者の人称と、修飾する名詞の性・数・格によって形が変わります。"
    - "付加語的に使われる形容詞は、定冠詞類の後では弱変化します。"
  next_steps: "次週は、形容詞の格変化（応用）、比較級と最上級、副詞の使い方、zu不定詞を学びます。これにより、より詳細で正確な表現ができるようになります。"