title: "第4週：複文と代名詞"
description: "ドイツ語の複文（接続詞と副文）と代名詞（人称代名詞・所有代名詞）について学習します。また、形容詞の格変化の基本も身につけます。"
week_number: 4
daily_goals:
  - day: 22
    title: "並列接続詞"
    tasks:
      - name: "並列接続詞の基本"
        description: "und, aber, oder, denn, sondern などの並列接続詞の使い方を学習します。"
      - name: "並列接続詞の語順"
        description: "並列接続詞が文の語順に与える影響を学習します。"
    grammar:
      - title: "並列接続詞の特徴"
        explanation: "並列接続詞は、同じ重要性を持つ2つの文（主文）をつなぐ接続詞です。接続詞の後の文は通常の語順（動詞が2番目）のままです。"
      - title: "主な並列接続詞"
        table:
          - conjunction: "und"
            meaning: "〜と、そして"
            example: "Ich lerne Deutsch und er lernt Englisch.（私はドイツ語を学び、彼は英語を学びます。）"
          - conjunction: "aber"
            meaning: "しかし、けれども"
            example: "Ich möchte kommen, aber ich habe keine Zeit.（私は来たいですが、時間がありません。）"
          - conjunction: "oder"
            meaning: "または、あるいは"
            example: "Gehst du ins Kino oder bleibst du zu Hause?（あなたは映画館に行きますか、それとも家にいますか？）"
          - conjunction: "denn"
            meaning: "なぜなら"
            example: "Ich bleibe zu Hause, denn es regnet.（私は家にいます、なぜなら雨が降っているからです。）"
          - conjunction: "sondern"
            meaning: "〜ではなくて（前文が否定の場合に使用）"
            example: "Das ist nicht ein Buch, sondern ein Heft.（それは本ではなく、ノートです。）"
    vocabulary:
      - word: "und"
        pronunciation: "ウント"
        meaning: "〜と、そして"
        audio_file: "und.mp3"
      - word: "aber"
        pronunciation: "アーバー"
        meaning: "しかし、けれども"
        audio_file: "aber.mp3"
      - word: "oder"
        pronunciation: "オーダー"
        meaning: "または、あるいは"
        audio_file: "oder.mp3"
      - word: "denn"
        pronunciation: "デン"
        meaning: "なぜなら"
        audio_file: "denn.mp3"
      - word: "sondern"
        pronunciation: "ゾンダーン"
        meaning: "〜ではなくて"
        audio_file: "sondern.mp3"
    examples:
      - german: "Ich lerne Deutsch und mein Bruder lernt Französisch."
        japanese: "私はドイツ語を学び、私の兄はフランス語を学びます。"
        audio_file: "example_und.mp3"
      - german: "Er möchte nach Japan reisen, aber er hat kein Geld."
        japanese: "彼は日本に旅行したいですが、お金がありません。"
        audio_file: "example_aber.mp3"
      - german: "Trinkst du Kaffee oder Tee?"
        japanese: "あなたはコーヒーと紅茶のどちらを飲みますか？"
        audio_file: "example_oder.mp3"
      - german: "Ich kann nicht kommen, denn ich bin krank."
        japanese: "私は来ることができません、なぜなら病気だからです。"
        audio_file: "example_denn.mp3"
      - german: "Das ist nicht schwer, sondern einfach."
        japanese: "それは難しくなく、簡単です。"
        audio_file: "example_sondern.mp3"

  - day: 23
    title: "副文を導く接続詞"
    tasks:
      - name: "副文を導く接続詞の基本"
        description: "dass, weil, wenn などの従属接続詞の使い方を学習します。"
      - name: "副文の語順"
        description: "副文内での動詞の位置など、語順の規則を学習します。"
    grammar:
      - title: "副文の特徴"
        explanation: "副文（従属文）は、主文に従属する文で、単独では意味が完結しません。副文では、動詞が文末に置かれるという特徴があります。"
      - title: "主な従属接続詞"
        table:
          - conjunction: "dass"
            meaning: "〜ということ"
            example: "Ich weiß, dass er in Berlin wohnt.（私は、彼がベルリンに住んでいることを知っています。）"
          - conjunction: "weil"
            meaning: "〜なので、〜だから"
            example: "Ich lerne Deutsch, weil ich nach Deutschland fahren möchte.（私はドイツに行きたいので、ドイツ語を学んでいます。）"
          - conjunction: "wenn"
            meaning: "もし〜なら、〜するとき"
            example: "Wenn es regnet, bleibe ich zu Hause.（雨が降ったら、私は家にいます。）"
          - conjunction: "ob"
            meaning: "〜かどうか"
            example: "Ich weiß nicht, ob er kommt.（私は彼が来るかどうか知りません。）"
      - title: "副文の語順"
        explanation: "副文では、動詞（定形）が文末に来ます。また、複合動詞（助動詞と本動詞の組み合わせなど）の場合は、助動詞が最後に来ます。"
        examples:
          - "Ich weiß, dass er Deutsch lernt.（私は、彼がドイツ語を学んでいることを知っています。）"
          - "Ich weiß, dass er Deutsch lernen will.（私は、彼がドイツ語を学びたいと思っていることを知っています。）（will が最後）"
    vocabulary:
      - word: "dass"
        pronunciation: "ダス"
        meaning: "〜ということ"
        audio_file: "dass.mp3"
      - word: "weil"
        pronunciation: "ヴァイル"
        meaning: "〜なので、〜だから"
        audio_file: "weil.mp3"
      - word: "wenn"
        pronunciation: "ヴェン"
        meaning: "もし〜なら、〜するとき"
        audio_file: "wenn.mp3"
      - word: "ob"
        pronunciation: "オプ"
        meaning: "〜かどうか"
        audio_file: "ob.mp3"
      - word: "obwohl"
        pronunciation: "オプヴォール"
        meaning: "〜にもかかわらず"
        audio_file: "obwohl.mp3"
    examples:
      - german: "Er sagt, dass er morgen kommt."
        japanese: "彼は明日来ると言っています。"
        audio_file: "example_dass.mp3"
      - german: "Ich gehe nicht zur Schule, weil ich krank bin."
        japanese: "私は病気なので、学校に行きません。"
        audio_file: "example_weil.mp3"
      - german: "Wenn es morgen regnet, bleiben wir zu Hause."
        japanese: "明日雨が降ったら、私たちは家にいます。"
        audio_file: "example_wenn.mp3"
      - german: "Ich weiß nicht, ob er die Prüfung bestanden hat."
        japanese: "彼がその試験に合格したかどうか知りません。"
        audio_file: "example_ob.mp3"
      - german: "Obwohl es regnet, gehe ich spazieren."
        japanese: "雨が降っているにもかかわらず、私は散歩に行きます。"
        audio_file: "example_obwohl.mp3"

  - day: 24
    title: "人称代名詞（1格・4格）"
    tasks:
      - name: "人称代名詞の基本"
        description: "人称代名詞の意味と使い方を学習します。"
      - name: "1格と4格の人称代名詞"
        description: "1格（主格）と4格（対格）の人称代名詞の形を学習します。"
    grammar:
      - title: "人称代名詞の基本"
        explanation: "人称代名詞は、名詞の代わりに使われる語で、文脈から明らかな人や物を指します。ドイツ語の人称代名詞は、人称、数、性、格によって形が変わります。"
      - title: "1格（主格）の人称代名詞"
        table:
          - person: "1人称単数"
            pronoun: "ich（私は）"
            example: "Ich lerne Deutsch.（私はドイツ語を学びます。）"
          - person: "2人称単数"
            pronoun: "du（あなたは）"
            example: "Du bist Student.（あなたは学生です。）"
          - person: "3人称単数 男性"
            pronoun: "er（彼は）"
            example: "Er kommt aus Japan.（彼は日本出身です。）"
          - person: "3人称単数 女性"
            pronoun: "sie（彼女は）"
            example: "Sie ist Lehrerin.（彼女は教師です。）"
          - person: "3人称単数 中性"
            pronoun: "es（それは）"
            example: "Es ist ein Buch.（それは本です。）"
          - person: "1人称複数"
            pronoun: "wir（私たちは）"
            example: "Wir gehen ins Kino.（私たちは映画館に行きます。）"
          - person: "2人称複数"
            pronoun: "ihr（あなたたちは）"
            example: "Ihr seid Studenten.（あなたたちは学生です。）"
          - person: "3人称複数"
            pronoun: "sie（彼らは）"
            example: "Sie kommen aus Deutschland.（彼らはドイツ出身です。）"
          - person: "敬称（単数・複数）"
            pronoun: "Sie（あなたは、あなたたちは）"
            example: "Kommen Sie aus Japan?（あなたは日本出身ですか？）"
      - title: "4格（対格）の人称代名詞"
        table:
          - person: "1人称単数"
            nominative: "ich"
            accusative: "mich（私を）"
            example: "Er sieht mich.（彼は私を見ます。）"
          - person: "2人称単数"
            nominative: "du"
            accusative: "dich（あなたを）"
            example: "Ich sehe dich.（私はあなたを見ます。）"
          - person: "3人称単数 男性"
            nominative: "er"
            accusative: "ihn（彼を）"
            example: "Sie liebt ihn.（彼女は彼を愛しています。）"
          - person: "3人称単数 女性"
            nominative: "sie"
            accusative: "sie（彼女を）"
            example: "Er liebt sie.（彼は彼女を愛しています。）"
          - person: "3人称単数 中性"
            nominative: "es"
            accusative: "es（それを）"
            example: "Ich kaufe es.（私はそれを買います。）"
          - person: "1人称複数"
            nominative: "wir"
            accusative: "uns（私たちを）"
            example: "Er sieht uns.（彼は私たちを見ます。）"
          - person: "2人称複数"
            nominative: "ihr"
            accusative: "euch（あなたたちを）"
            example: "Wir sehen euch.（私たちはあなたたちを見ます。）"
          - person: "3人称複数"
            nominative: "sie"
            accusative: "sie（彼らを）"
            example: "Ich kenne sie.（私は彼らを知っています。）"
          - person: "敬称（単数・複数）"
            nominative: "Sie"
            accusative: "Sie（あなたを、あなたたちを）"
            example: "Ich sehe Sie.（私はあなた（たち）を見ます。）"
    vocabulary:
      - word: "ich"
        pronunciation: "イヒ"
        meaning: "私は"
        audio_file: "ich.mp3"
      - word: "du"
        pronunciation: "ドゥー"
        meaning: "あなたは"
        audio_file: "du.mp3"
      - word: "er"
        pronunciation: "エア"
        meaning: "彼は"
        audio_file: "er.mp3"
      - word: "sie (単数)"
        pronunciation: "ズィー"
        meaning: "彼女は"
        audio_file: "sie_singular.mp3"
      - word: "es"
        pronunciation: "エス"
        meaning: "それは"
        audio_file: "es.mp3"
      - word: "wir"
        pronunciation: "ヴィーア"
        meaning: "私たちは"
        audio_file: "wir.mp3"
      - word: "ihr"
        pronunciation: "イーア"
        meaning: "あなたたちは"
        audio_file: "ihr.mp3"
      - word: "sie (複数)"
        pronunciation: "ズィー"
        meaning: "彼らは"
        audio_file: "sie_plural.mp3"
      - word: "Sie (敬称)"
        pronunciation: "ズィー"
        meaning: "あなたは（敬称）"
        audio_file: "Sie_formal.mp3"
    examples:
      - german: "Kennst du ihn? —Ja, ich kenne ihn gut."
        japanese: "あなたは彼を知っていますか？—はい、私は彼をよく知っています。"
        audio_file: "example_ihn.mp3"
      - german: "Liebst du mich? —Ja, ich liebe dich."
        japanese: "あなたは私を愛していますか？—はい、私はあなたを愛しています。"
        audio_file: "example_mich_dich.mp3"
      - german: "Siehst du sie? —Nein, ich sehe sie nicht."
        japanese: "あなたは彼女を見ますか？—いいえ、私は彼女を見ません。"
        audio_file: "example_sie_acc.mp3"
      - german: "Ich sehe euch morgen."
        japanese: "私は明日あなたたちに会います。"
        audio_file: "example_euch.mp3"
      - german: "Kennen Sie uns? —Ja, ich kenne Sie auch."
        japanese: "あなたは私たちを知っていますか？—はい、私もあなたを知っています。"
        audio_file: "example_Sie_acc.mp3"

  - day: 25
    title: "人称代名詞（3格）と代名詞の語順"
    tasks:
      - name: "3格の人称代名詞"
        description: "3格（与格）の人称代名詞の形を学習します。"
      - name: "複数の代名詞がある場合の語順"
        description: "3格と4格の代名詞が共に出てくる場合の語順を学習します。"
    grammar:
      - title: "3格（与格）の人称代名詞"
        table:
          - person: "1人称単数"
            nominative: "ich"
            dative: "mir（私に）"
            example: "Er gibt mir ein Buch.（彼は私に本をくれます。）"
          - person: "2人称単数"
            nominative: "du"
            dative: "dir（あなたに）"
            example: "Ich gebe dir ein Geschenk.（私はあなたにプレゼントをあげます。）"
          - person: "3人称単数 男性"
            nominative: "er"
            dative: "ihm（彼に）"
            example: "Sie gibt ihm einen Brief.（彼女は彼に手紙をあげます。）"
          - person: "3人称単数 女性"
            nominative: "sie"
            dative: "ihr（彼女に）"
            example: "Er gibt ihr eine Blume.（彼は彼女に花をあげます。）"
          - person: "3人称単数 中性"
            nominative: "es"
            dative: "ihm（それに）"
            example: "Ich gebe ihm Wasser.（私はそれに水をあげます。）"
          - person: "1人称複数"
            nominative: "wir"
            dative: "uns（私たちに）"
            example: "Sie gibt uns Bücher.（彼女は私たちに本をくれます。）"
          - person: "2人称複数"
            nominative: "ihr"
            dative: "euch（あなたたちに）"
            example: "Wir geben euch Geschenke.（私たちはあなたたちにプレゼントをあげます。）"
          - person: "3人称複数"
            nominative: "sie"
            dative: "ihnen（彼らに）"
            example: "Ich gebe ihnen Äpfel.（私は彼らにリンゴをあげます。）"
          - person: "敬称（単数・複数）"
            nominative: "Sie"
            dative: "Ihnen（あなたに、あなたたちに）"
            example: "Ich gebe Ihnen ein Buch.（私はあなた（たち）に本をあげます。）"
      - title: "代名詞の語順"
        explanation: "文中に3格と4格の代名詞が共に出てくる場合、通常は「3格の前に4格」の順番で配置します。ただし、es（4格）の場合は例外で、「es の前に3格」となります。"
        examples:
          - "Ich gebe es dir.（私はそれをあなたにあげます。）"
          - "Er zeigt ihn mir.（彼はそれを私に見せます。）"
          - "Sie gibt sie ihm.（彼女はそれを彼に見せます。）"
    vocabulary:
      - word: "mir"
        pronunciation: "ミーア"
        meaning: "私に"
        audio_file: "mir.mp3"
      - word: "dir"
        pronunciation: "ディーア"
        meaning: "あなたに"
        audio_file: "dir.mp3"
      - word: "ihm"
        pronunciation: "イーム"
        meaning: "彼に、それに（中性）"
        audio_file: "ihm.mp3"
      - word: "ihr"
        pronunciation: "イーア"
        meaning: "彼女に"
        audio_file: "ihr_dat.mp3"
      - word: "uns"
        pronunciation: "ウンス"
        meaning: "私たちに"
        audio_file: "uns.mp3"
      - word: "euch"
        pronunciation: "オイヒ"
        meaning: "あなたたちに"
        audio_file: "euch.mp3"
      - word: "ihnen"
        pronunciation: "イーネン"
        meaning: "彼らに"
        audio_file: "ihnen.mp3"
      - word: "Ihnen"
        pronunciation: "イーネン"
        meaning: "あなたに（敬称）"
        audio_file: "Ihnen.mp3"
    examples:
      - german: "Ich gebe dir ein Buch."
        japanese: "私はあなたに本をあげます。"
        audio_file: "example_dir.mp3"
      - german: "Er zeigt mir sein Zimmer."
        japanese: "彼は私に彼の部屋を見せます。"
        audio_file: "example_mir.mp3"
      - german: "Wir schenken ihm ein Hemd."
        japanese: "私たちは彼にシャツをプレゼントします。"
        audio_file: "example_ihm.mp3"
      - german: "Ich gebe es dir."
        japanese: "私はそれをあなたにあげます。"
        audio_file: "example_es_dir.mp3"
      - german: "Kannst du mir helfen?"
        japanese: "あなたは私を手伝ってくれますか？"
        audio_file: "example_mir_help.mp3"

  - day: 26
    title: "所有代名詞"
    tasks:
      - name: "所有代名詞の基本"
        description: "所有代名詞の意味と基本的な使い方を学習します。"
      - name: "所有代名詞の格変化"
        description: "所有代名詞の1格と4格での変化を学習します。"
    grammar:
      - title: "所有代名詞の基本"
        explanation: "所有代名詞は、「私の」「あなたの」などの所有関係を表します。ドイツ語の所有代名詞は、所有者の人称によって異なる形を取り、また修飾する名詞の性・数・格によっても変化します。"
      - title: "人称ごとの所有代名詞（基本形）"
        table:
          - person: "1人称単数（私の）"
            pronoun: "mein"
            example: "Das ist mein Buch.（これは私の本です。）"
          - person: "2人称単数（あなたの）"
            pronoun: "dein"
            example: "Ist das dein Auto?（それはあなたの車ですか？）"
          - person: "3人称単数 男性/中性（彼の、それの）"
            pronoun: "sein"
            example: "Das ist sein Haus.（それは彼の家です。）"
          - person: "3人称単数 女性（彼女の）"
            pronoun: "ihr"
            example: "Das ist ihr Buch.（それは彼女の本です。）"
          - person: "1人称複数（私たちの）"
            pronoun: "unser"
            example: "Das ist unser Haus.（それは私たちの家です。）"
          - person: "2人称複数（あなたたちの）"
            pronoun: "euer"
            example: "Ist das euer Auto?（それはあなたたちの車ですか？）"
          - person: "3人称複数（彼らの）"
            pronoun: "ihr"
            example: "Das ist ihr Haus.（それは彼らの家です。）"
          - person: "敬称（あなたの）"
            pronoun: "Ihr"
            example: "Ist das Ihr Mantel?（それはあなたのコートですか？）"
      - title: "所有代名詞の格変化（1格と4格）"
        explanation: "所有代名詞は、修飾する名詞の性・数・格に合わせて変化します。変化のパターンは不定冠詞（ein, eine）と同じです。"
        table:
          - case: "1格 男性"
            pattern: "mein, dein, sein, ihr, unser, euer, ihr, Ihr"
            example: "Mein Vater ist Arzt.（私の父は医者です。）"
          - case: "1格 女性"
            pattern: "meine, deine, seine, ihre, unsere, eure, ihre, Ihre"
            example: "Meine Mutter ist Lehrerin.（私の母は教師です。）"
          - case: "1格 中性"
            pattern: "mein, dein, sein, ihr, unser, euer, ihr, Ihr"
            example: "Mein Kind ist 5 Jahre alt.（私の子供は5歳です。）"
          - case: "1格 複数"
            pattern: "meine, deine, seine, ihre, unsere, eure, ihre, Ihre"
            example: "Meine Kinder sind in der Schule.（私の子供たちは学校にいます。）"
          - case: "4格 男性"
            pattern: "meinen, deinen, seinen, ihren, unseren, euren, ihren, Ihren"
            example: "Ich sehe meinen Vater.（私は私の父を見ます。）"
          - case: "4格 女性"
            pattern: "meine, deine, seine, ihre, unsere, eure, ihre, Ihre"
            example: "Ich sehe meine Mutter.（私は私の母を見ます。）"
          - case: "4格 中性"
            pattern: "mein, dein, sein, ihr, unser, euer, ihr, Ihr"
            example: "Ich sehe mein Kind.（私は私の子供を見ます。）"
          - case: "4格 複数"
            pattern: "meine, deine, seine, ihre, unsere, eure, ihre, Ihre"
            example: "Ich sehe meine Kinder.（私は私の子供たちを見ます。）"
    vocabulary:
      - word: "mein"
        pronunciation: "マイン"
        meaning: "私の"
        audio_file: "mein.mp3"
      - word: "dein"
        pronunciation: "ダイン"
        meaning: "あなたの"
        audio_file: "dein.mp3"
      - word: "sein"
        pronunciation: "ザイン"
        meaning: "彼の、それの"
