  - day: 34
    title: "不定代名詞と否定表現"
    tasks:
      - name: "不定代名詞（man, jemand, niemand, etwas, nichts）"
        description: "不特定の人や物を表す不定代名詞の使い方を学習します。"
      - name: "否定表現（nicht, kein, niemand, nie, nichts）"
        description: "様々な否定表現の使い方と位置を学習します。"
    grammar:
      - title: "不定代名詞"
        table:
          - pronoun: "man（人、一般的に誰かが）"
            explanation: "不特定の人、「〜するものだ」という一般的な事柄を表します。"
            example: "In Deutschland spricht man Deutsch.（ドイツではドイツ語を話します。）"
          - pronoun: "jemand（誰か）"
            explanation: "不特定の人を表します。"
            example: "Ist jemand da?（誰かいますか？）"
          - pronoun: "niemand（誰も〜ない）"
            explanation: "「誰も〜ない」という否定を表します。"
            example: "Niemand ist da.（誰もいません。）"
          - pronoun: "etwas（何か）"
            explanation: "不特定の物を表します。"
            example: "Ich möchte etwas trinken.（何か飲みたいです。）"
          - pronoun: "nichts（何も〜ない）"
            explanation: "「何も〜ない」という否定を表します。"
            example: "Ich verstehe nichts.（私は何も理解していません。）"
      - title: "否定表現"
        table:
          - negation: "nicht（〜ない）"
            explanation: "文全体または文の特定の部分を否定します。通常、否定する語の前に置きます。文全体を否定する場合は文末近くに置きます。"
            example: "Ich komme nicht.（私は来ません。）"
          - negation: "kein/keine（〜ない、一つも〜ない）"
            explanation: "名詞の前に置いて、その存在を否定します。不定冠詞の否定形です。"
            example: "Ich habe kein Geld.（私はお金を持っていません。）"
          - negation: "niemand（誰も〜ない）"
            explanation: "「誰も〜ない」という人に関する否定を表します。"
            example: "Niemand kommt.（誰も来ません。）"
          - negation: "nie/niemals（決して〜ない）"
            explanation: "「決して〜ない」という強い否定を表します。"
            example: "Ich gehe nie ins Kino.（私は決して映画館に行きません。）"
          - negation: "nichts（何も〜ない）"
            explanation: "「何も〜ない」という物に関する否定を表します。"
            example: "Er sagt nichts.（彼は何も言いません。）"
      - title: "nicht の位置"
        explanation: "nicht の位置によって、否定の範囲が変わります。"
        examples:
          - "文全体の否定：Ich gehe heute nicht ins Kino.（私は今日映画館に行きません。）"
          - "特定の語句の否定：Ich gehe nicht heute ins Kino, sondern morgen.（私は今日ではなく明日映画館に行きます。）"
    vocabulary:
      - word: "man"
        pronunciation: "マン"
        meaning: "人、一般的に誰かが"
        audio_file: "man.mp3"
      - word: "jemand"
        pronunciation: "イェーマント"
        meaning: "誰か"
        audio_file: "jemand.mp3"
      - word: "niemand"
        pronunciation: "ニーマント"
        meaning: "誰も〜ない"
        audio_file: "niemand.mp3"
      - word: "etwas"
        pronunciation: "エトヴァス"
        meaning: "何か"
        audio_file: "etwas.mp3"
      - word: "nichts"
        pronunciation: "ニヒツ"
        meaning: "何も〜ない"
        audio_file: "nichts.mp3"
    examples:
      - german: "In Japan isst man viel Reis."
        japanese: "日本では多くのお米を食べます。"
        audio_file: "example_man.mp3"
      - german: "Hat jemand mein Buch gesehen?"
        japanese: "誰か私の本を見ましたか？"
        audio_file: "example_jemand.mp3"
      - german: "Niemand kann diese Frage beantworten."
        japanese: "誰もこの質問に答えることができません。"
        audio_file: "example_niemand.mp3"
      - german: "Ich habe keine Zeit."
        japanese: "私は時間がありません。"
        audio_file: "example_keine.mp3"
      - german: "Er versteht nichts."
        japanese: "彼は何も理解していません。"
        audio_file: "example_nichts.mp3"

  - day: 35
    title: "第5週の総復習"
    tasks:
      - name: "形容詞の格変化と比較形の復習"
        description: "形容詞の格変化（定冠詞類・不定冠詞類と共に、および冠詞なし）と比較級・最上級を復習します。"
      - name: "副詞とzu不定詞の復習"
        description: "副詞の使い方とzu不定詞（um ... zu構文を含む）を復習します。"
      - name: "不定代名詞と否定表現の復習"
        description: "不定代名詞と否定表現の使い方を復習します。"
    practice:
      - title: "形容詞の格変化"
        exercises:
          - question: "Ich trinke _____ (kalt) Wasser."
            answer: "kaltes"
          - question: "Er trägt _____ (schwarz) Mantel."
            answer: "einen schwarzen"
          - question: "Das ist _____ (interessant) Buch."
            answer: "ein interessantes"
          - question: "Die _____ (klein) Kinder spielen im Garten."
            answer: "kleinen"
      - title: "比較級と最上級"
        exercises:
          - question: "Mein Bruder ist _____ (groß) als ich."
            answer: "größer"
          - question: "Tokio ist die _____ (groß) Stadt Japans."
            answer: "größte"
          - question: "Im Sommer ist es _____ (heiß) als im Frühling."
            answer: "heißer"
          - question: "Was isst du _____ (gern)?"
            answer: "am liebsten"
      - title: "zu不定詞とum ... zu構文"
        exercises:
          - question: "Ich versuche, Deutsch _____ (lernen)."
            answer: "zu lernen"
          - question: "Er geht ins Fitnessstudio, _____ gesund _____ (bleiben)."
            answer: "um ... zu bleiben"
          - question: "Es ist wichtig, jeden Tag _____ (üben)."
            answer: "zu üben"
          - question: "Sie hat vergessen, mir _____ (anrufen)."
            answer: "anzurufen"
      - title: "不定代名詞と否定表現"
        exercises:
          - question: "In Deutschland trinkt _____ viel Bier."
            answer: "man"
          - question: "Ich habe _____ Zeit."
            answer: "keine"
          - question: "_____ kann mir helfen."
            answer: "Niemand"
          - question: "Ich verstehe _____."
            answer: "nichts"
    examples:
      - german: "Der junge Mann trägt einen schwarzen Mantel und ein weißes Hemd. Er ist größer als sein Bruder. Er trinkt am liebsten Kaffee. Es ist wichtig, jeden Tag Deutsch zu üben, um besser zu werden. Niemand kann ohne Übung eine Sprache lernen."
        japanese: "その若い男性は黒いコートと白いシャツを着ています。彼は彼の兄弟より背が高いです。彼はコーヒーが一番好きです。より上達するために毎日ドイツ語を練習することは重要です。練習なしでは誰も言語を学ぶことはできません。"
        audio_file: "example_week5_review.mp3"

weekly_review:
  summary: "今週は、形容詞の格変化（応用）、比較級と最上級、副詞の使い方、zu不定詞、不定代名詞と否定表現について学習しました。これらの文法要素を使うことで、より詳細で正確なドイツ語の表現ができるようになりました。"
  key_points:
    - "形容詞は冠詞の種類によって変化のパターンが異なります（定冠詞類の後は弱変化、不定冠詞類の後は混合変化、冠詞なしは強変化）。"
    - "比較級は「形容詞 + -er」で作り、「A ist [比較級] als B」で「AはBより〜」を表します。"
    - "最上級は「am + 形容詞 + -sten」または「定冠詞 + 形容詞 + -ste/-sten」で表します。"
    - "副詞は動詞、形容詞、他の副詞を修飾し、文中では通常「TeKaMoLo」（時間→原因→様態→場所）の順に配置します。"
    - "zu不定詞は目的や意図を表し、um ... zu構文で「〜するために」という目的を表現できます。"
    - "不定代名詞（man, jemand, etwas など）と否定表現（nicht, kein, niemand, nichts など）を使って、より複雑な表現ができます。"
  next_steps: "次週は、関係代名詞と関係文、接続法II式（基本）、受動態（現在形）、話法の助動詞について学びます。これらの文法要素を使うことで、さらに複雑で洗練されたドイツ語の文を作れるようになります。" 