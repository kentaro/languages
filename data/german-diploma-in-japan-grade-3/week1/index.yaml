title: "第1週：基礎文法と基本語彙"
description: "ドイツ語の基礎となる文法要素と基本的な語彙を学習します。この週では、動詞の現在形、冠詞、名詞の性と格変化（1格・4格）を中心に学びます。"
week_number: 1
daily_goals:
  - day: 1
    title: "ドイツ語の基本と発音"
    tasks:
      - name: "アルファベットと発音規則の学習"
        description: "ドイツ語特有の発音（ウムラウト, ß）とアルファベットを練習します。"
      - name: "挨拶と自己紹介の表現"
        description: "基本的な挨拶と自己紹介の表現を学習します。"
    vocabulary:
      - word: "Guten Morgen"
        pronunciation: "グーテン モルゲン"
        meaning: "おはようございます"
        audio_file: "guten_morgen.mp3"
      - word: "Guten Tag"
        pronunciation: "グーテン ターク"
        meaning: "こんにちは"
        audio_file: "guten_tag.mp3"
      - word: "Guten Abend"
        pronunciation: "グーテン アーベント"
        meaning: "こんばんは"
        audio_file: "guten_abend.mp3"
      - word: "Auf Wiedersehen"
        pronunciation: "アウフ ヴィーダーゼーエン"
        meaning: "さようなら"
        audio_file: "auf_wiedersehen.mp3"
      - word: "Ich heiße ..."
        pronunciation: "イヒ ハイセ ..."
        meaning: "私の名前は...です"
        audio_file: "ich_heisse.mp3"
    examples:
      - german: "Guten Tag! Ich heiße Maria. Wie heißt du?"
        japanese: "こんにちは！私の名前はマリアです。あなたの名前は何ですか？"
        audio_file: "example_intro_1.mp3"
      - german: "Ich komme aus Japan. Woher kommst du?"
        japanese: "私は日本から来ました。あなたはどこから来ましたか？"
        audio_file: "example_intro_2.mp3"

  - day: 2
    title: "動詞の現在形（規則変化）"
    tasks:
      - name: "規則動詞の活用"
        description: "規則動詞の現在形の活用パターンを学習します。"
      - name: "基本的な文型"
        description: "主語＋動詞の基本的な文型を練習します。"
    grammar:
      - title: "規則動詞の現在形"
        explanation: "ドイツ語の規則動詞は語幹に人称ごとの語尾を付けて活用します。"
        table:
          - person: "ich (私は)"
            ending: "-e"
            example: "mach**e**"
          - person: "du (あなたは)"
            ending: "-st"
            example: "mach**st**"
          - person: "er/sie/es (彼/彼女/それは)"
            ending: "-t"
            example: "mach**t**"
          - person: "wir (私たちは)"
            ending: "-en"
            example: "mach**en**"
          - person: "ihr (あなたたちは)"
            ending: "-t"
            example: "mach**t**"
          - person: "sie/Sie (彼ら/あなた[敬称]は)"
            ending: "-en"
            example: "mach**en**"
    vocabulary:
      - word: "machen"
        pronunciation: "マッヘン"
        meaning: "する、作る"
        audio_file: "machen.mp3"
      - word: "lernen"
        pronunciation: "レルネン"
        meaning: "学ぶ"
        audio_file: "lernen.mp3"
      - word: "wohnen"
        pronunciation: "ヴォーネン"
        meaning: "住む"
        audio_file: "wohnen.mp3"
      - word: "arbeiten"
        pronunciation: "アルバイテン"
        meaning: "働く"
        audio_file: "arbeiten.mp3"
      - word: "spielen"
        pronunciation: "シュピーレン"
        meaning: "遊ぶ、演奏する"
        audio_file: "spielen.mp3"
    examples:
      - german: "Ich lerne Deutsch."
        japanese: "私はドイツ語を学びます。"
        audio_file: "example_lernen.mp3"
      - german: "Wir wohnen in Tokio."
        japanese: "私たちは東京に住んでいます。"
        audio_file: "example_wohnen.mp3"
      - german: "Sie arbeitet in einer Schule."
        japanese: "彼女は学校で働いています。"
        audio_file: "example_arbeiten.mp3"

  - day: 3
    title: "動詞の現在形（不規則変化）"
    tasks:
      - name: "不規則動詞の活用"
        description: "よく使われる不規則動詞（sein, haben など）の活用を学習します。"
      - name: "語幹母音が変化する動詞"
        description: "語幹母音が変化する動詞（e→i, a→ä など）の活用を学習します。"
    grammar:
      - title: "不規則動詞 sein（〜である）の活用"
        table:
          - person: "ich"
            conjugation: "bin"
          - person: "du"
            conjugation: "bist"
          - person: "er/sie/es"
            conjugation: "ist"
          - person: "wir"
            conjugation: "sind"
          - person: "ihr"
            conjugation: "seid"
          - person: "sie/Sie"
            conjugation: "sind"
      - title: "不規則動詞 haben（持っている）の活用"
        table:
          - person: "ich"
            conjugation: "habe"
          - person: "du"
            conjugation: "hast"
          - person: "er/sie/es"
            conjugation: "hat"
          - person: "wir"
            conjugation: "haben"
          - person: "ihr"
            conjugation: "habt"
          - person: "sie/Sie"
            conjugation: "haben"
    vocabulary:
      - word: "sein"
        pronunciation: "ザイン"
        meaning: "〜である"
        audio_file: "sein.mp3"
      - word: "haben"
        pronunciation: "ハーベン"
        meaning: "持っている"
        audio_file: "haben.mp3"
      - word: "fahren"
        pronunciation: "ファーレン"
        meaning: "行く、運転する"
        audio_file: "fahren.mp3"
      - word: "lesen"
        pronunciation: "レーゼン"
        meaning: "読む"
        audio_file: "lesen.mp3"
      - word: "sehen"
        pronunciation: "ゼーエン"
        meaning: "見る"
        audio_file: "sehen.mp3"
    examples:
      - german: "Ich bin Student."
        japanese: "私は学生です。"
        audio_file: "example_sein_1.mp3"
      - german: "Er hat ein neues Auto."
        japanese: "彼は新しい車を持っています。"
        audio_file: "example_haben_1.mp3"
      - german: "Du fährst nach Berlin."
        japanese: "あなたはベルリンへ行きます。"
        audio_file: "example_fahren_1.mp3"
      - german: "Sie liest ein Buch."
        japanese: "彼女は本を読んでいます。"
        audio_file: "example_lesen_1.mp3"

  - day: 4
    title: "名詞の性"
    tasks:
      - name: "名詞の性（男性・女性・中性）の基本"
        description: "ドイツ語の名詞は男性、女性、中性の3つの性に分かれていることを学習します。"
      - name: "名詞の性を見分けるヒント"
        description: "名詞の性を見分けるためのパターンやヒントを学びます。"
    grammar:
      - title: "名詞の性"
        explanation: "ドイツ語の名詞は文法上の性（男性、女性、中性）を持ちます。基本的に自然な性別とは一致しないため、名詞と一緒に性を覚える必要があります。"
        table:
          - gender: "男性名詞（Maskulinum）"
            article: "der"
            examples: "der Mann（男性）、der Tisch（テーブル）、der Apfel（リンゴ）"
          - gender: "女性名詞（Femininum）"
            article: "die"
            examples: "die Frau（女性）、die Tasche（バッグ）、die Milch（牛乳）"
          - gender: "中性名詞（Neutrum）"
            article: "das"
            examples: "das Kind（子供）、das Buch（本）、das Wasser（水）"
    vocabulary:
      - word: "der Mann"
        pronunciation: "デア マン"
        meaning: "男性"
        audio_file: "der_mann.mp3"
      - word: "die Frau"
        pronunciation: "ディ フラウ"
        meaning: "女性"
        audio_file: "die_frau.mp3"
      - word: "das Kind"
        pronunciation: "ダス キント"
        meaning: "子供"
        audio_file: "das_kind.mp3"
      - word: "der Tisch"
        pronunciation: "デア ティッシュ"
        meaning: "テーブル"
        audio_file: "der_tisch.mp3"
      - word: "die Tür"
        pronunciation: "ディ テュア"
        meaning: "ドア"
        audio_file: "die_tuer.mp3"
    examples:
      - german: "Der Mann ist Lehrer."
        japanese: "その男性は教師です。"
        audio_file: "example_mann.mp3"
      - german: "Die Frau kauft ein Buch."
        japanese: "その女性は本を買います。"
        audio_file: "example_frau.mp3"
      - german: "Das Kind spielt im Garten."
        japanese: "その子供は庭で遊んでいます。"
        audio_file: "example_kind.mp3"

  - day: 5
    title: "定冠詞と不定冠詞（1格）"
    tasks:
      - name: "定冠詞（der, die, das）の使い方"
        description: "定冠詞の基本的な使い方と1格での形を学習します。"
      - name: "不定冠詞（ein, eine, ein）の使い方"
        description: "不定冠詞の基本的な使い方と1格での形を学習します。"
    grammar:
      - title: "定冠詞（1格）"
        explanation: "定冠詞は特定のもの（話し手と聞き手がともに知っているもの）を指すときに使います。英語の「the」に相当します。"
        table:
          - gender: "男性名詞"
            article: "der"
            example: "der Stuhl（その椅子）"
          - gender: "女性名詞"
            article: "die"
            example: "die Lampe（そのランプ）"
          - gender: "中性名詞"
            article: "das"
            example: "das Fenster（その窓）"
          - gender: "複数形"
            article: "die"
            example: "die Bücher（それらの本）"
      - title: "不定冠詞（1格）"
        explanation: "不定冠詞は不特定のもの（初めて言及するもの）を指すときに使います。英語の「a, an」に相当します。"
        table:
          - gender: "男性名詞"
            article: "ein"
            example: "ein Stuhl（一つの椅子）"
          - gender: "女性名詞"
            article: "eine"
            example: "eine Lampe（一つのランプ）"
          - gender: "中性名詞"
            article: "ein"
            example: "ein Fenster（一つの窓）"
          - gender: "複数形"
            article: "-- (keine)"
            example: "Bücher（本[複数]）"
    vocabulary:
      - word: "der Stuhl"
        pronunciation: "デア シュトゥール"
        meaning: "椅子"
        audio_file: "der_stuhl.mp3"
      - word: "die Lampe"
        pronunciation: "ディ ランペ"
        meaning: "ランプ"
        audio_file: "die_lampe.mp3"
      - word: "das Fenster"
        pronunciation: "ダス フェンスター"
        meaning: "窓"
        audio_file: "das_fenster.mp3"
      - word: "der Stift"
        pronunciation: "デア シュティフト"
        meaning: "ペン"
        audio_file: "der_stift.mp3"
      - word: "die Uhr"
        pronunciation: "ディ ウーア"
        meaning: "時計"
        audio_file: "die_uhr.mp3"
    examples:
      - german: "Das ist ein Stift. Der Stift ist blau."
        japanese: "これはペンです。そのペンは青いです。"
        audio_file: "example_stift.mp3"
      - german: "Ich kaufe eine Lampe. Die Lampe ist schön."
        japanese: "私はランプを買います。そのランプは綺麗です。"
        audio_file: "example_lampe.mp3"
      - german: "Er hat ein Buch. Das Buch ist interessant."
        japanese: "彼は本を持っています。その本は面白いです。"
        audio_file: "example_buch.mp3"

  - day: 6
    title: "名詞の格変化（1格と4格）"
    tasks:
      - name: "1格（主格）の用法"
        description: "文の主語として使われる1格の用法を学習します。"
      - name: "4格（対格）の用法"
        description: "直接目的語として使われる4格の用法を学習します。"
      - name: "4格を取る動詞"
        description: "4格目的語を取る基本的な動詞を学習します。"
    grammar:
      - title: "1格と4格の基本"
        explanation: "1格（主格）は文の主語、4格（対格）は直接目的語を示します。"
      - title: "定冠詞の格変化（1格と4格）"
        table:
          - gender: "男性名詞"
            nominative: "der"
            accusative: "den"
          - gender: "女性名詞"
            nominative: "die"
            accusative: "die"
          - gender: "中性名詞"
            nominative: "das"
            accusative: "das"
          - gender: "複数形"
            nominative: "die"
            accusative: "die"
      - title: "不定冠詞の格変化（1格と4格）"
        table:
          - gender: "男性名詞"
            nominative: "ein"
            accusative: "einen"
          - gender: "女性名詞"
            nominative: "eine"
            accusative: "eine"
          - gender: "中性名詞"
            nominative: "ein"
            accusative: "ein"
    vocabulary:
      - word: "sehen"
        pronunciation: "ゼーエン"
        meaning: "見る"
        audio_file: "sehen.mp3"
      - word: "kaufen"
        pronunciation: "カウフェン"
        meaning: "買う"
        audio_file: "kaufen.mp3"
      - word: "trinken"
        pronunciation: "トリンケン"
        meaning: "飲む"
        audio_file: "trinken.mp3"
      - word: "essen"
        pronunciation: "エッセン"
        meaning: "食べる"
        audio_file: "essen.mp3"
      - word: "suchen"
        pronunciation: "ズッヘン"
        meaning: "探す"
        audio_file: "suchen.mp3"
    examples:
      - german: "Der Mann kauft einen Apfel."
        japanese: "その男性はリンゴを一つ買います。"
        audio_file: "example_kaufen_apfel.mp3"
      - german: "Die Frau trinkt eine Tasse Kaffee."
        japanese: "その女性は一杯のコーヒーを飲みます。"
        audio_file: "example_trinken_kaffee.mp3"
      - german: "Das Kind isst ein Stück Kuchen."
        japanese: "その子供はケーキを一切れ食べます。"
        audio_file: "example_essen_kuchen.mp3"
      - german: "Ich sehe den Film."
        japanese: "私はその映画を見ます。"
        audio_file: "example_sehen_film.mp3"

  - day: 7
    title: "基本語彙と表現の総復習"
    tasks:
      - name: "第1週の文法事項の復習"
        description: "動詞の現在形、名詞の性、冠詞の使い方、1格と4格の用法を復習します。"
      - name: "基本単語の復習"
        description: "学習した単語を使った文章作成練習をします。"
      - name: "自己紹介の練習"
        description: "すべての学習内容を使って、簡単な自己紹介文を作成します。"
    practice:
      - title: "単語と文型の練習"
        exercises:
          - question: "Ich _____ Maria. (heißen)"
            answer: "heiße"
          - question: "Er _____ in Berlin. (wohnen)"
            answer: "wohnt"
          - question: "_____ du Deutsch? (lernen)"
            answer: "Lernst"
          - question: "Wir _____ einen Film. (sehen)"
            answer: "sehen"
      - title: "冠詞と格変化の練習"
        exercises:
          - question: "Ich kaufe _____ Buch. (das, 4格)"
            answer: "das"
          - question: "Er trinkt _____ Kaffee. (der, 4格)"
            answer: "den"
          - question: "_____ Frau liest _____ Zeitung. (die, 1格 / die, 4格)"
            answer: "Die, die"
    examples:
      - german: "Guten Tag! Ich heiße Akiko. Ich bin Studentin und lerne Deutsch. Ich wohne in Tokio. Ich habe einen Bruder. Er ist Arzt. Ich lese gerne Bücher und höre Musik. Ich trinke gerne Kaffee."
        japanese: "こんにちは！私の名前はアキコです。私は学生でドイツ語を勉強しています。私は東京に住んでいます。私には兄がいます。彼は医者です。私は本を読むのと音楽を聴くのが好きです。私はコーヒーを飲むのが好きです。"
        audio_file: "example_self_intro.mp3"

weekly_review:
  summary: "今週は、ドイツ語の基礎となる重要な文法概念を学びました。動詞の現在形（規則・不規則）、名詞の性（男性・女性・中性）、定冠詞と不定冠詞、1格と4格の用法を理解することができました。また、基本的な自己紹介ができるようになりました。"
  key_points:
    - "ドイツ語の規則動詞は人称によって語尾が変化します（-e, -st, -t, -en, -t, -en）。"
    - "不規則動詞（sein, habenなど）は特別な活用をします。"
    - "ドイツ語の名詞は男性・女性・中性の3つの性があり、それぞれ定冠詞は der, die, das、不定冠詞は ein, eine, ein となります。"
    - "4格（対格）では男性名詞の冠詞が変化します（der → den, ein → einen）。"
  next_steps: "次週は、名詞の3格（与格）と前置詞を学びます。これにより、より複雑な文章を作れるようになります。また、疑問詞と疑問文、命令形も学習する予定です。" 