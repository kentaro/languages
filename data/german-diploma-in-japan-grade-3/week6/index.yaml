title: "第6週：関係代名詞と接続法"
description: "関係代名詞と関係文、接続法II式の基本、受動態（現在形）、話法の助動詞などの高度なドイツ語文法を学習します。また、これまでに学んだ語彙の復習と強化も行います。"
week_number: 6
daily_goals:
  - day: 36
    title: "関係代名詞と関係文"
    tasks:
      - name: "関係代名詞の基本"
        description: "関係代名詞の意味と基本的な使い方を学習します。"
      - name: "関係文の構造"
        description: "関係文の構造と語順を学習します。"
      - name: "1格と4格の関係代名詞"
        description: "1格と4格の関係代名詞の形と使い方を学習します。"
    grammar:
      - title: "関係代名詞と関係文の基本"
        explanation: "関係代名詞は先行詞（名詞）を指し、それに関する情報を追加するために使われます。関係文は副文の一種で、動詞が文末に置かれます。"
      - title: "関係代名詞の形（1格と4格）"
        table:
          - gender: "男性"
            nominative: "der（〜する人・もの）"
            accusative: "den（〜を）"
            example: "Der Mann, der dort steht, ist mein Vater.（そこに立っている男性は私の父です。）"
          - gender: "女性"
            nominative: "die（〜する人・もの）"
            accusative: "die（〜を）"
            example: "Die Frau, die ich kenne, ist Lehrerin.（私が知っている女性は教師です。）"
          - gender: "中性"
            nominative: "das（〜する人・もの）"
            accusative: "das（〜を）"
            example: "Das Buch, das ich lese, ist interessant.（私が読んでいる本は面白いです。）"
          - gender: "複数"
            nominative: "die（〜する人・もの）"
            accusative: "die（〜を）"
            example: "Die Kinder, die im Garten spielen, sind laut.（庭で遊んでいる子供たちはうるさいです。）"
      - title: "関係文の語順"
        explanation: "関係文は、接続詞を使った副文（Nebensatz）と同じ語順になります。つまり、動詞（定形）は文末に来ます。"
        examples:
          - "Der Mann, der in Berlin wohnt, ist mein Freund.（ベルリンに住んでいる男性は私の友人です。）"
          - "Das Buch, das ich gestern gekauft habe, ist sehr interessant.（私が昨日買った本はとても面白いです。）"
    vocabulary:
      - word: "der Mann"
        pronunciation: "デア マン"
        meaning: "男性"
        audio_file: "der_mann.mp3"
      - word: "die Frau"
        pronunciation: "ディ フラウ"
        meaning: "女性"
        audio_file: "die_frau.mp3"
      - word: "das Kind"
        pronunciation: "ダス キント"
        meaning: "子供"
        audio_file: "das_kind.mp3"
      - word: "das Buch"
        pronunciation: "ダス ブーフ"
        meaning: "本"
        audio_file: "das_buch.mp3"
      - word: "wohnen"
        pronunciation: "ヴォーネン"
        meaning: "住む"
        audio_file: "wohnen.mp3"
    examples:
      - german: "Der Mann, der dort steht, ist mein Vater."
        japanese: "そこに立っている男性は私の父です。"
        audio_file: "example_rel_der.mp3"
      - german: "Die Frau, die ein rotes Kleid trägt, ist meine Lehrerin."
        japanese: "赤いドレスを着ている女性は私の先生です。"
        audio_file: "example_rel_die.mp3"
      - german: "Das Kind, das im Garten spielt, ist mein Bruder."
        japanese: "庭で遊んでいる子供は私の弟です。"
        audio_file: "example_rel_das.mp3"
      - german: "Ich kenne den Mann, den du gestern getroffen hast."
        japanese: "私はあなたが昨日会った男性を知っています。"
        audio_file: "example_rel_den.mp3"
      - german: "Die Bücher, die auf dem Tisch liegen, sind neu."
        japanese: "テーブルの上にある本は新しいです。"
        audio_file: "example_rel_die_pl.mp3"

  - day: 37
    title: "3格の関係代名詞と前置詞を伴う関係代名詞"
    tasks:
      - name: "3格の関係代名詞"
        description: "3格の関係代名詞の形と使い方を学習します。"
      - name: "前置詞を伴う関係代名詞"
        description: "前置詞と共に使う関係代名詞の形と使い方を学習します。"
    grammar:
      - title: "3格の関係代名詞"
        table:
          - gender: "男性"
            dative: "dem（〜に）"
            example: "Der Mann, dem ich helfe, ist mein Nachbar.（私が手伝っている男性は私の隣人です。）"
          - gender: "女性"
            dative: "der（〜に）"
            example: "Die Frau, der ich danke, ist sehr nett.（私が感謝している女性はとても親切です。）"
          - gender: "中性"
            dative: "dem（〜に）"
            example: "Das Kind, dem ich ein Geschenk gebe, ist mein Neffe.（私がプレゼントをあげる子供は私の甥です。）"
          - gender: "複数"
            dative: "denen（〜に）"
            example: "Die Studenten, denen ich Deutsch lehre, sind fleißig.（私がドイツ語を教えている学生たちは勤勉です。）"
      - title: "前置詞を伴う関係代名詞"
        explanation: "前置詞と関係代名詞を一緒に使うことができます。関係代名詞の形は、前置詞が要求する格によって決まります。"
        examples:
          - "Der Mann, mit dem ich spreche, ist Arzt.（私が話している男性は医者です。）"
          - "Die Stadt, in der ich wohne, ist sehr schön.（私が住んでいる都市はとても美しいです。）"
          - "Das Haus, in dem ich lebe, ist alt.（私が住んでいる家は古いです。）"
          - "Die Freunde, mit denen ich reise, sind Japaner.（私が一緒に旅行している友達は日本人です。）"
    vocabulary:
      - word: "helfen"
        pronunciation: "ヘルフェン"
        meaning: "手伝う、助ける"
        audio_file: "helfen.mp3"
      - word: "danken"
        pronunciation: "ダンケン"
        meaning: "感謝する"
        audio_file: "danken.mp3"
      - word: "mit"
        pronunciation: "ミット"
        meaning: "〜と一緒に"
        audio_file: "mit.mp3"
      - word: "in"
        pronunciation: "イン"
        meaning: "〜の中に/中で"
        audio_file: "in.mp3"
      - word: "von"
        pronunciation: "フォン"
        meaning: "〜から、〜の"
        audio_file: "von.mp3"
    examples:
      - german: "Der Mann, dem ich helfe, ist alt."
        japanese: "私が手伝っている男性は年配です。"
        audio_file: "example_rel_dem.mp3"
      - german: "Die Frau, der ich danke, arbeitet hier."
        japanese: "私が感謝している女性はここで働いています。"
        audio_file: "example_rel_der_dat.mp3"
      - german: "Der Freund, mit dem ich reise, spricht gut Japanisch."
        japanese: "私が一緒に旅行している友人は日本語が上手です。"
        audio_file: "example_rel_mit_dem.mp3"
      - german: "Die Stadt, in der ich lebe, ist Tokio."
        japanese: "私が住んでいる都市は東京です。"
        audio_file: "example_rel_in_der.mp3"
      - german: "Das Café, von dem ich dir erzählt habe, ist dort."
        japanese: "私があなたに話したカフェはそこです。"
        audio_file: "example_rel_von_dem.mp3"

  - day: 38
    title: "接続法II式（基本）"
    tasks:
      - name: "接続法II式の基本"
        description: "接続法II式の意味と基本的な形を学習します。"
      - name: "願望、非現実の仮定を表す表現"
        description: "接続法II式を使った願望や非現実の仮定の表し方を学習します。"
      - name: "丁寧な依頼・要求"
        description: "接続法II式を使った丁寧な表現の仕方を学習します。"
    grammar:
      - title: "接続法II式の基本"
        explanation: "接続法II式（Konjunktiv II）は、非現実的な願望や仮定、丁寧な依頼などを表すために使われます。過去形の語幹にウムラウト（可能な場合）を加え、特別な語尾を付けて作ります。"
      - title: "主な動詞の接続法II式"
        table:
          - verb: "sein（〜である）"
            indicative: "war"
            subjunctive: "wäre"
            example: "Wenn ich reich wäre, würde ich ein Haus kaufen.（もし私が金持ちなら、家を買うだろう。）"
          - verb: "haben（持っている）"
            indicative: "hatte"
            subjunctive: "hätte"
            example: "Wenn ich Zeit hätte, würde ich dich besuchen.（もし私に時間があれば、あなたを訪ねるだろう。）"
          - verb: "werden（〜になる）"
            indicative: "wurde"
            subjunctive: "würde"
            example: "Ich würde gern nach Deutschland fahren.（私はドイツに行きたいです。）"
          - verb: "können（できる）"
            indicative: "konnte"
            subjunctive: "könnte"
            example: "Ich könnte dir helfen, wenn du willst.（あなたが望むなら、私はあなたを手伝うことができます。）"
          - verb: "müssen（〜しなければならない）"
            indicative: "musste"
            subjunctive: "müsste"
            example: "Du müsstest mehr lernen.（あなたはもっと勉強しなければならないだろう。）"
      - title: "würde + 不定詞 構文"
        explanation: "多くの動詞の接続法II式は、würde + 不定詞 の形で表すこともできます。特に日常会話ではこの形式が一般的です。"
        examples:
          - "Ich würde gern kommen.（私は喜んで来たいです。）"
          - "Er würde dir helfen, wenn er könnte.（もし彼ができるなら、彼はあなたを手伝うだろう。）"
          - "Was würdest du tun?（あなたは何をするだろう？）"
      - title: "接続法II式の用法"
        items:
          - "非現実的な願望：Ich hätte gern einen Kaffee.（コーヒーをいただきたいです。）"
          - "非現実的な仮定：Wenn ich Zeit hätte, würde ich ein Buch lesen.（もし時間があれば、私は本を読むだろう。）"
          - "丁寧な依頼：Könnten Sie mir helfen?（手伝っていただけますか？）"
          - "控えめな表現：Ich würde sagen, dass...（〜だと言いたいです。）"
    vocabulary:
      - word: "reich"
        pronunciation: "ライヒ"
        meaning: "金持ちの"
        audio_file: "reich.mp3"
      - word: "gern"
        pronunciation: "ゲルン"
        meaning: "喜んで"
        audio_file: "gern.mp3"
      - word: "wenn"
        pronunciation: "ヴェン"
        meaning: "もし〜なら"
        audio_file: "wenn.mp3"
      - word: "vielleicht"
        pronunciation: "フィライヒト"
        meaning: "おそらく"
        audio_file: "vielleicht.mp3"
      - word: "möglich"
        pronunciation: "メークリッヒ"
        meaning: "可能な"
        audio_file: "moeglich.mp3"
    examples:
      - german: "Wenn ich Zeit hätte, würde ich dich besuchen."
        japanese: "もし時間があれば、あなたを訪ねるだろう。"
        audio_file: "example_wenn_haette.mp3"
      - german: "Ich wäre gern Arzt."
        japanese: "私は医者になりたいです。"
        audio_file: "example_waere_gern.mp3"
      - german: "Könnten Sie mir bitte helfen?"
        japanese: "手伝っていただけませんか？"
        audio_file: "example_koennten_Sie.mp3"
      - german: "Was würdest du an meiner Stelle tun?"
        japanese: "私の立場なら、あなたは何をするだろう？"
        audio_file: "example_wuerdest_du.mp3"
      - german: "Ich hätte gern einen Kaffee, bitte."
        japanese: "コーヒーをいただきたいです、お願いします。"
        audio_file: "example_haette_gern.mp3"

  - day: 39
    title: "受動態（現在形）"
    tasks:
      - name: "受動態の基本"
        description: "受動態の意味と基本的な形を学習します。"
      - name: "現在形の受動態の作り方"
        description: "現在形の受動態の作り方と使い方を学習します。"
      - name: "行為者の表現（von, durch）"
        description: "受動態での行為者の表し方を学習します。"
    grammar:
      - title: "受動態の基本"
        explanation: "受動態は、行為を受ける対象を主語として表現する形です。「〜される」という意味になります。ドイツ語の受動態は、助動詞 werden + 過去分詞で作ります。"
      - title: "現在形の受動態"
        explanation: "現在形の受動態は、werden の現在形 + 過去分詞で表します。"
        table:
          - person: "ich"
            passive: "werde + 過去分詞"
            example: "Ich werde gefragt.（私は質問されます。）"
          - person: "du"
            passive: "wirst + 過去分詞"
            example: "Du wirst gelobt.（あなたは褒められます。）"
          - person: "er/sie/es"
            passive: "wird + 過去分詞"
            example: "Er wird eingeladen.（彼は招待されます。）"
          - person: "wir"
            passive: "werden + 過去分詞"
            example: "Wir werden informiert.（私たちは知らされます。）"
          - person: "ihr"
            passive: "werdet + 過去分詞"
            example: "Ihr werdet gesucht.（あなたたちは探されています。）"
          - person: "sie/Sie"
            passive: "werden + 過去分詞"
            example: "Sie werden erwartet.（彼らは/あなたは期待されています。）"
      - title: "能動態から受動態への変換"
        examples:
          - "能動態：Der Lehrer lobt den Schüler.（先生は生徒を褒めます。）"
          - "受動態：Der Schüler wird vom Lehrer gelobt.（生徒は先生に褒められます。）"
          - "能動態：Man baut ein neues Haus.（新しい家が建てられています。）"
          - "受動態：Ein neues Haus wird gebaut.（新しい家が建てられています。）"
      - title: "行為者の表現"
        explanation: "受動態で行為者（〜によって）を表す場合は、次のような前置詞を使います："
        items:
          - "von + 3格：人や生物が行為者の場合"
          - "durch + 4格：物や事柄が行為者の場合"
        examples:
          - "Das Buch wird von dem Autor geschrieben.（その本は著者によって書かれます。）"
          - "Die Stadt wurde durch ein Erdbeben zerstört.（その都市は地震によって破壊されました。）"
    vocabulary:
      - word: "bauen"
        pronunciation: "バウエン"
        meaning: "建てる"
        audio_file: "bauen.mp3"
      - word: "schreiben"
        pronunciation: "シュライベン"
        meaning: "書く"
        audio_file: "schreiben.mp3"
      - word: "lesen"
        pronunciation: "レーゼン"
        meaning: "読む"
        audio_file: "lesen.mp3"
      - word: "kaufen"
        pronunciation: "カウフェン"
        meaning: "買う"
        audio_file: "kaufen.mp3"
      - word: "verkaufen"
        pronunciation: "フェアカウフェン"
        meaning: "売る"
        audio_file: "verkaufen.mp3"
    examples:
      - german: "Das Haus wird gebaut."
        japanese: "その家は建てられています。"
        audio_file: "example_pass_haus.mp3"
      - german: "Die Bücher werden von Studenten gelesen."
        japanese: "その本は学生たちによって読まれています。"
        audio_file: "example_pass_buecher.mp3"
      - german: "Der Brief wird geschrieben."
        japanese: "その手紙は書かれています。"
        audio_file: "example_pass_brief.mp3"
      - german: "Wir werden zum Fest eingeladen."
        japanese: "私たちはパーティーに招待されます。"
        audio_file: "example_pass_eingeladen.mp3"
      - german: "Deutsch wird in Deutschland gesprochen."
        japanese: "ドイツ語はドイツで話されています。"
        audio_file: "example_pass_deutsch.mp3"

  - day: 40
    title: "話法の助動詞"
    tasks:
      - name: "話法の助動詞の基本"
        description: "話法の助動詞の意味と用法の復習と応用を学習します。"
      - name: "話法の助動詞の客観的用法と主観的用法"
        description: "話法の助動詞の客観的用法と主観的用法の違いを学習します。"
    grammar:
      - title: "話法の助動詞の復習"
        table:
          - verb: "können"
            meaning_objective: "能力（〜できる）"
            meaning_subjective: "可能性（〜かもしれない）"
            example: "Er kann Deutsch sprechen.（彼はドイツ語を話すことができます。）"
          - verb: "müssen"
            meaning_objective: "必要性（〜しなければならない）"
            meaning_subjective: "確実性（〜にちがいない）"
            example: "Ich muss heute arbeiten.（私は今日働かなければなりません。）"
          - verb: "dürfen"
            meaning_objective: "許可（〜してもよい）"
            meaning_subjective: "推量（〜だろう）"
            example: "Du darfst hier rauchen.（あなたはここでタバコを吸ってもいいです。）"
          - verb: "sollen"
            meaning_objective: "義務・要請（〜すべきだ）"
            meaning_subjective: "伝聞（〜だそうだ）"
            example: "Du sollst fleißig lernen.（あなたは熱心に勉強すべきです。）"
          - verb: "wollen"
            meaning_objective: "意志（〜したい）"
            meaning_subjective: "主張（〜だと主張する）"
            example: "Ich will nach Deutschland fahren.（私はドイツに行きたいです。）"
          - verb: "mögen/möchten"
            meaning_objective: "好み/願望（〜が好き/〜したい）"
            meaning_subjective: "推量（〜かもしれない）"
            example: "Ich mag Kaffee.（私はコーヒーが好きです。）"
      - title: "話法の助動詞の客観的用法"
        explanation: "客観的用法は、能力、必要性、許可、義務などの「客観的な」意味を表します。"
        examples:
          - "können（能力）：Ich kann schwimmen.（私は泳げます。）"
          - "müssen（必要性）：Wir müssen jetzt gehen.（私たちは今行かなければなりません。）"
          - "dürfen（許可）：Hier darf man nicht rauchen.（ここではタバコを吸ってはいけません。）"
          - "sollen（義務）：Du sollst deine Hausaufgaben machen.（あなたは宿題をすべきです。）"
          - "wollen（意志）：Ich will Arzt werden.（私は医者になりたいです。）"
      - title: "話法の助動詞の主観的用法"
        explanation: "主観的用法は、話者の判断、推量、伝聞などの「主観的な」意味を表します。"
        examples:
          - "können（可能性）：Es kann heute regnen.（今日は雨が降るかもしれません。）"
          - "müssen（確実性）：Er muss krank sein.（彼は病気にちがいありません。）"
          - "dürfen（推量）：Das dürfte stimmen.（それは正しいでしょう。）"
          - "sollen（伝聞）：Er soll sehr reich sein.（彼はとても金持ちだそうです。）"
          - "wollen（主張）：Er will nichts gesehen haben.（彼は何も見なかったと主張しています。）"
    vocabulary:
      - word: "vielleicht"
        pronunciation: "フィライヒト"
        meaning: "おそらく"
        audio_file: "vielleicht.mp3"
      - word: "wahrscheinlich"
        pronunciation: "ヴァールシャインリッヒ"
        meaning: "たぶん"
        audio_file: "wahrscheinlich.mp3"
      - word: "bestimmt"
        pronunciation: "ベシュティムト"
        meaning: "きっと"
        audio_file: "bestimmt.mp3"
      - word: "angeblich"
        pronunciation: "アンゲプリッヒ"
        meaning: "〜だそうだ"
        audio_file: "angeblich.mp3"
      - word: "unbedingt"
        pronunciation: "ウンベディングト"
        meaning: "絶対に"
        audio_file: "unbedingt.mp3"
    examples:
      - german: "Er kann gut Klavier spielen."
        japanese: "彼はピアノを上手に弾くことができます。（客観的用法）"
        audio_file: "example_kann_klavier.mp3"
      - german: "Es kann morgen regnen."
        japanese: "明日は雨が降るかもしれません。（主観的用法）"
        audio_file: "example_kann_regnen.mp3"
      - german: "Wir müssen heute lernen."
        japanese: "私たちは今日勉強しなければなりません。（客観的用法）"
        audio_file: "example_muessen_lernen.mp3"
      - german: "Er muss zu Hause sein, das Licht ist an."
        japanese: "彼は家にいるにちがいありません、電気がついています。（主観的用法）"
        audio_file: "example_muss_zuhause.mp3"
      - german: "Er soll sehr intelligent sein."
        japanese: "彼はとても頭が良いそうです。（主観的用法）"
        audio_file: "example_soll_intelligent.mp3"

  - day: 41
    title: "語彙強化（1）：日常生活"
    tasks:
