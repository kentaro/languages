  - day: 42
    title: "第6週の総復習"
    tasks:
      - name: "関係代名詞と関係文の復習"
        description: "関係代名詞と関係文の作り方と使い方を復習します。"
      - name: "接続法II式と受動態の復習"
        description: "接続法II式の形と用法、および受動態の作り方を復習します。"
      - name: "話法の助動詞の客観的用法と主観的用法の復習"
        description: "話法の助動詞の客観的用法と主観的用法の違いを復習します。"
    practice:
      - title: "関係代名詞と関係文"
        exercises:
          - question: "Der Mann, _____ dort steht, ist mein Vater. (1格)"
            answer: "der"
          - question: "Die Frau, _____ ich kenne, ist Lehrerin. (4格)"
            answer: "die"
          - question: "Das Kind, _____ ich helfe, ist mein Nachbar. (3格)"
            answer: "dem"
          - question: "Die Stadt, _____ _____ ich wohne, ist Tokio. (前置詞 + 関係代名詞)"
            answer: "in der"
      - title: "接続法II式と受動態"
        exercises:
          - question: "Wenn ich Zeit _____, würde ich dich besuchen. (haben)"
            answer: "hätte"
          - question: "_____ Sie mir bitte helfen? (können)"
            answer: "Könnten"
          - question: "Das Haus _____ gebaut. (受動態の現在形)"
            answer: "wird"
          - question: "Die Bücher _____ von Studenten gelesen. (受動態の現在形)"
            answer: "werden"
      - title: "話法の助動詞"
        exercises:
          - question: "Er _____ Deutsch sprechen. (können - 客観的用法)"
            answer: "kann"
          - question: "Es _____ morgen regnen. (können - 主観的用法)"
            answer: "kann"
          - question: "Er _____ krank sein. (müssen - 主観的用法)"
            answer: "muss"
          - question: "Er _____ sehr intelligent sein. (sollen - 主観的用法)"
            answer: "soll"
    examples:
      - german: "Der Mann, der in Berlin wohnt und den ich gestern getroffen habe, ist mein Freund. Wenn ich Zeit hätte, würde ich ihn öfter besuchen. Das neue Haus wird von einer Firma gebaut. Es muss sehr teuer sein, aber es soll sehr modern sein."
        japanese: "ベルリンに住んでいて、私が昨日会った男性は私の友人です。もし時間があれば、私は彼にもっと頻繁に会いに行くでしょう。新しい家は会社によって建てられています。それはとても高価に違いありませんが、とてもモダンだそうです。"
        audio_file: "example_week6_review.mp3"

weekly_review:
  summary: "今週は、関係代名詞と関係文、接続法II式の基本、受動態（現在形）、話法の助動詞の客観的用法と主観的用法について学習しました。また、日常生活に関する語彙も強化しました。これらの文法要素を使うことで、より複雑で洗練されたドイツ語の文を作れるようになりました。"
  key_points:
    - "関係代名詞（der, die, das）は先行詞を指し、それに関する情報を追加するために使われます。関係文は副文の一種で、動詞が文末に置かれます。"
    - "接続法II式は非現実的な願望や仮定、丁寧な依頼などを表すために使われます。基本形は waren→wäre, hätten→hätte などですが、würde + 不定詞の形もよく使われます。"
    - "受動態は「werden + 過去分詞」で作り、「〜される」という意味を表します。行為者は von + 3格（人）または durch + 4格（物・事柄）で表します。"
    - "話法の助動詞には客観的用法（能力、必要性など）と主観的用法（可能性、確実性など）があります。"
  next_steps: "次週は、模擬試験演習、弱点分野の強化、リスニング強化、重要文法・語彙の総復習、試験の時間配分練習など、試験対策を中心に学習を進めます。" 